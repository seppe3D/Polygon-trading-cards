    .filter(c => (state.owned.get(c.id) || 0) > 1)
    .sort((a, b) => (RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]) || a.id - b.id);
  const dupeTotal = dupes.reduce((n, c) => n + (state.owned.get(c.id) - 1) * SHOP.sell[c.rarity], 0);

  view.innerHTML = `<section class="col" style="max-width:none">
    <div class="battle-top">
      ${pageHead('Shop', 'shop')}
      <span class="coinpill shop-balance">🪙 <span data-coin>${state.wallet}</span> polycoins</span>
    </div>
    <p class="msg tmsg" id="shopMsg" role="alert"></p>
    <div class="two-col shop-grid">
      <div>
        <h3>Pakjes</h3>
        <div class="shop-packs">${Object.entries(SHOP.packs).map(([k, p]) => `
          <div class="shop-pack">
            <div class="pack mini" aria-hidden="true"><div class="pack-body"><div class="pack-label"><span class="pack-logo">POLYGON</span><span class="pack-sub">TRADING CARDS</span><span class="pack-count">${p.count === 1 ? '1 kaart' : `${p.count} kaarten`}</span></div></div><div class="pack-top"></div></div>
            <div class="shop-pack-info"><strong>${p.name}</strong><small>${p.desc}</small>
              <button class="btn small" data-buy-pack="${k}" type="button" ${state.wallet < p.price ? 'disabled' : ''}>Kopen · ${p.price} 🪙</button></div>
          </div>`).join('')}</div>

        ${state.v13 ? `<h3 style="margin-top:20px">Stickers & bureau</h3>
        <div class="battle-bar"><button class="btn small" data-goto="stickers" type="button">🏷️ Stickerpakje (40 🪙)</button>
          <button class="btn small" data-goto="profile" type="button">🪑 Bureau inrichten</button></div>` : ''}
        <h3 style="margin-top:20px">Cosmetica</h3>
        <div id="cosmetics"><p class="hint">Laden…</p></div>

      </div>
      <div>
        <h3>Dubbels verkopen of opwaarderen</h3>
        ${dupes.length ? `<p class="hint" style="margin-bottom:6px">Je houdt altijd 1 exemplaar. Alles verkopen levert ${dupeTotal} 🪙 op.${state.v12 ? ' Met 2 dubbels waardeer je een kaart op: +10% HP/ATK/DEF in Battle per ★ (max ★★★).' : ''}</p>
          <div class="shop-list">${dupes.map(c => {
            const extra = state.owned.get(c.id) - 1, price = SHOP.sell[c.rarity], lv = myLevel(c.id);
            return `<div class="battle-row">
              <span class="trade-chip r-${c.rarity}">${lv > 1 ? stars(lv) + ' ' : ''}${esc(c.name)}</span>
              <span class="battle-row-text"><small>${extra} extra · ${price} 🪙 per stuk</small></span>
              <button class="link" data-sell="${c.id}" data-count="1" type="button">Verkoop 1</button>
              ${extra > 1 ? `<button class="link" data-sell="${c.id}" data-count="${extra}" type="button">Alle ${extra} (+${extra * price})</button>` : ''}
              ${state.v12 && c.rarity !== 'cat' && extra >= 2 && lv < 3 ? `<button class="link" data-upgrade="${c.id}" type="button">⬆️ Naar ${stars(lv + 1)}</button>` : ''}
            </div>`;
          }).join('')}</div>`
          : '<p class="hint">Je hebt geen dubbels om te verkopen.</p>'}

        <h3 style="margin-top:20px">Wordle-hulp</h3>
        <p class="hint">Tijdens een Wordle-ronde op <strong>Today</strong>: 💡 een letter onthullen voor ${SHOP.hint} 🪙 (max 2 per ronde) of ➕ een 7e poging voor ${SHOP.extra} 🪙 (koop die vóór je 6e gok).</p>

    </div>
  </section>`;

  const msg = (text, ok) => { const m = $('#shopMsg'); m.className = 'msg tmsg ' + (ok ? 'ok' : 'err'); m.textContent = text; };

  view.querySelectorAll('[data-buy-pack]').forEach(b => b.onclick = async () => {
    const p = SHOP.packs[b.dataset.buyPack];
    if (!confirm(`${p.name} kopen voor ${p.price} polycoins?`)) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('shop_buy_pack', { p_kind: b.dataset.buyPack });
    if (error) { msg(error.message); b.disabled = false; return; }
    setWallet(data.wallet);
    for (const c of data.cards) state.owned.set(c.id, (state.owned.get(c.id) || 0) + 1);
    const dlg = $('#packModal');
    dlg.innerHTML = `<div class="packbox"><h2>${p.name}</h2><div class="stage" id="packStage"></div><div id="packDone"></div></div>`;
    dlg.showModal();
    await openPack($('#packStage'), data.cards);
    const dup = data.cards.filter(c => c.is_duplicate).length;
    $('#packDone').innerHTML = `<p class="result">${dup ? `${dup === data.cards.length ? 'Allemaal dubbels' : `${dup} dubbel${dup > 1 ? 's' : ''}`} — die kan je verkopen of ruilen.` : 'Allemaal nieuwe kaarten voor je boek!'}</p>
      <button class="btn small" id="packClose" type="button">Verder</button>`;
    dlg.onclose = () => { dlg.onclose = null; if (state.tab === 'shop') renderShop(view); checkCollection(); };
    $('#packClose').onclick = () => dlg.close();
  });

  view.querySelectorAll('[data-upgrade]').forEach(b => b.onclick = async () => {
    const c = cardById(b.dataset.upgrade), lv = myLevel(c.id);
    if (!confirm(`2 dubbels van "${c.name}" gebruiken om op te waarderen naar ${stars(lv + 1)}?`)) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('upgrade_card', { p_card_id: c.id });
    if (error) { msg(error.message); b.disabled = false; return; }
    state.owned.set(c.id, state.owned.get(c.id) - 2);
    state.levels.set(c.id, data.level);
    renderShop(view);
    msg(`"${c.name}" is nu ${stars(data.level)}.`, true);
  });

  drawCosmetics($('#cosmetics'), msg);
  view.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { state.tab = b.dataset.goto; renderMain(); });

  view.querySelectorAll('[data-sell]').forEach(b => b.onclick = async () => {
    const c = cardById(b.dataset.sell), n = Number(b.dataset.count);
    if (n > 1 && !confirm(`${n} exemplaren van "${c.name}" verkopen voor ${n * SHOP.sell[c.rarity]} polycoins?`)) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('shop_sell_duplicates', { p_card_id: c.id, p_count: n });
    if (error) { msg(error.message); b.disabled = false; return; }
    setWallet(data.wallet);
    state.owned.set(c.id, state.owned.get(c.id) - data.sold);
    renderShop(view);
    msg(`Verkocht: ${data.sold}× "${c.name}" voor ${data.earned} polycoins.`, true);
  });
}

// Kaartranden, profielringen en titels (schema-v12): kopen en aan/uit zetten
const COSMETIC_GROUPS = [
  ['frame', 'Kaartranden', 'Een rand rond al jouw kaarten in je boek.'],
  ['ring', 'Profielringen', 'Een ring rond je profielfoto, ook zichtbaar voor je vrienden.'],
  ['title', 'Titels', 'Staat naast je naam in de vriendenlijst van anderen.'],
];
async function drawCosmetics(box, msg) {
  if (!box) return;
  const { data, error } = await sb.rpc('cosmetics_state');
  if (!box.isConnected) return;
  if (error) { box.innerHTML = v12Missing; return; }
  box.innerHTML = COSMETIC_GROUPS.map(([kind, label, desc]) => `<div class="cos-group"><h4>${label}</h4><small class="hint">${desc}</small>
    <div class="cos-list">${data.filter(x => x.kind === kind).map(x => {
      const on = state.equipped[kind] === x.key;
      const prev = kind === 'frame' ? `<span class="cos-prev frame-prev ${x.key.replace('frame_', 'frame-')}"></span>`
        : kind === 'ring' ? `<span class="cos-prev${ringCls(x.key)}"></span>` : '';
      const action = x.owned
        ? `<button class="${on ? 'link' : 'btn small'}" data-equip="${kind}" data-key="${on ? '' : esc(x.key)}" type="button">${on ? 'Uitzetten' : 'Gebruiken'}</button>`
        : x.price == null ? '<small class="hint" style="margin:0">Verdien je met een volledig boek</small>'
        : `<button class="btn small" data-buy-cos="${esc(x.key)}" type="button" ${state.wallet < x.price ? 'disabled' : ''}>${x.price} 🪙</button>`;
      return `<div class="cos-item${on ? ' on' : ''}">${prev}<span class="cos-name">${kind === 'title' ? `<span class="title-chip" style="margin:0">${esc(x.name)}</span>` : esc(x.name)}</span>${action}</div>`;
    }).join('')}</div></div>`).join('');

  box.querySelectorAll('[data-buy-cos]').forEach(b => b.onclick = async () => {
    const item = data.find(x => x.key === b.dataset.buyCos);
    if (!confirm(`"${item.name}" kopen voor ${item.price} polycoins?`)) return;
    b.disabled = true;
    const { data: res, error: err } = await sb.rpc('buy_cosmetic', { p_key: item.key });
    if (err) { msg(err.message); b.disabled = false; return; }
    setWallet(res.wallet);
    await sb.rpc('equip_cosmetic', { p_kind: item.kind, p_key: item.key });
    state.equipped[item.kind] = item.key;
    afterEquip();
    msg(`Gekocht en meteen in gebruik: ${item.name}.`, true);
    drawCosmetics(box, msg);
  });
  box.querySelectorAll('[data-equip]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.equip, key = b.dataset.key || null;
    b.disabled = true;
    const { error: err } = await sb.rpc('equip_cosmetic', { p_kind: kind, p_key: key });
    if (err) { msg(err.message); b.disabled = false; return; }
    state.equipped[kind] = key;
    afterEquip();
    drawCosmetics(box, msg);
  });
}
// Profielring in de kopregel meteen bijwerken
function afterEquip() {
  const av = $('#openAccount');
  if (av) av.className = 'avbtn' + ringCls(state.equipped.ring);
}

// ---------- Tab: Ideas — ideeënbus met upvotes (schema-v11-suggestions.sql) ----------
const IDEA_STATUS = {
  open: { icon: '💭', label: 'Open' },
  planned: { icon: '📅', label: 'Gepland' },
  done: { icon: '✅', label: 'Klaar' },
  rejected: { icon: '❌', label: 'Niet gepland' },
};
const ideaState = { sort: 'votes' };

async function renderIdeas(view) {
  view.innerHTML = `<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>`;
  const uid = state.session.user.id;
  const [sug, votes] = await Promise.all([
    sb.from('suggestions').select('id, user_id, body, status, created_at').order('created_at', { ascending: false }),
    sb.from('suggestion_votes').select('suggestion_id, user_id'),
  ]);
  if (state.tab !== 'ideas') return;
  if (sug.error) {
    view.innerHTML = `<section class="col">${pageHead('Ideeënbus', 'ideas')}<p class="msg err">De ideeënbus kon niet geladen worden: ${esc(sug.error.message)}</p></section>`;
    return;
  }
  const count = {}, mine = new Set();
  for (const v of votes.data || []) {
    count[v.suggestion_id] = (count[v.suggestion_id] || 0) + 1;
    if (v.user_id === uid) mine.add(v.suggestion_id);
  }
  const ids = [...new Set(sug.data.map(s => s.user_id))];
  const names = {};
  if (ids.length) {
    const { data: profs } = await sb.from('profiles').select('id, display_name').in('id', ids);
    for (const p of profs || []) names[p.id] = p.display_name;
  }
  const rank = { open: 0, planned: 1, done: 2, rejected: 3 };
  const list = [...sug.data].sort((a, b) => ideaState.sort === 'new'
    ? b.created_at.localeCompare(a.created_at)
    : (rank[a.status] > 1) - (rank[b.status] > 1) || (count[b.id] || 0) - (count[a.id] || 0) || b.created_at.localeCompare(a.created_at));
  const when = d => new Date(d).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' });

  view.innerHTML = `<section class="col" style="max-width:none">
    ${pageHead('Ideeënbus', 'ideas')}
    <div class="two-col ideas-grid">
      <div>
        <form id="ideaForm" class="form" style="margin-top:0">
          <label>Jouw idee<textarea id="ideaBody" rows="4" maxlength="500" placeholder="Wat zou de site nog leuker maken?"></textarea></label>
          <div class="battle-bar"><button class="btn small" type="submit">Idee indienen</button><small class="hint" id="ideaLen" style="margin:0">0/500</small></div>
          <p class="msg tmsg" id="ideaMsg" role="alert"></p>
        </form>
      </div>
      <div>
        <div class="battle-bar" style="margin-bottom:8px">
          <h3 style="margin:0">Ideeën (${list.length})</h3>
          <div class="seg">
            <button type="button" data-sort="votes" class="${ideaState.sort === 'votes' ? 'on' : ''}">Populair</button>
            <button type="button" data-sort="new" class="${ideaState.sort === 'new' ? 'on' : ''}">Nieuwste</button>
          </div>
        </div>
        <div class="idea-list">${list.length ? list.map(s => {
          const st = IDEA_STATUS[s.status] || IDEA_STATUS.open;
          return `<div class="idea status-${s.status}">
            <button type="button" class="vote${mine.has(s.id) ? ' on' : ''}" data-vote="${s.id}" aria-pressed="${mine.has(s.id)}" aria-label="Upvote">
              <span class="vote-arrow">▲</span><span class="vote-n">${count[s.id] || 0}</span></button>
            <div class="idea-main">
              <p class="idea-body">${esc(s.body)}</p>
              <div class="idea-meta">
                ${state.isAdmin ? '' : `<span class="idea-status">${st.icon} ${st.label}</span>`}
                <span>${esc(names[s.user_id] || '…')} · ${when(s.created_at)}</span>
                ${state.isAdmin ? `<select class="idea-set" data-status="${s.id}" aria-label="Status">
                    ${Object.entries(IDEA_STATUS).map(([k, v]) => `<option value="${k}"${k === s.status ? ' selected' : ''}>${v.icon} ${v.label}</option>`).join('')}
                  </select>` : ''}
                ${s.user_id === uid || state.isAdmin ? `<button type="button" class="link danger" data-del-idea="${s.id}">Verwijderen</button>` : ''}
              </div>
            </div>
          </div>`;
        }).join('') : '<p class="hint">Nog geen ideeën. Wees de eerste!</p>'}</div>
      </div>
    </div>
  </section>`;

  const body = $('#ideaBody'), msg = $('#ideaMsg');
  body.oninput = () => { $('#ideaLen').textContent = `${body.value.length}/500`; };
  $('#ideaForm').onsubmit = async e => {
    e.preventDefault();
    const text = body.value.trim();
    if (text.length < 3) { msg.className = 'msg tmsg err'; msg.textContent = 'Schrijf minstens een paar woorden.'; return; }
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.from('suggestions').insert({ body: text }).select('id').single();
    if (error) { msg.className = 'msg tmsg err'; msg.textContent = error.message; btn.disabled = false; return; }
    await sb.from('suggestion_votes').insert({ suggestion_id: data.id }); // je stemt meteen op je eigen idee
    ideaState.sort = 'new';
    renderIdeas(view);
  };
  view.querySelectorAll('[data-sort]').forEach(b => { b.onclick = () => { ideaState.sort = b.dataset.sort; renderIdeas(view); }; });
  view.querySelectorAll('[data-vote]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.vote), on = b.classList.contains('on');
    b.disabled = true;
    // Meteen tonen, daarna opslaan
    const n = b.querySelector('.vote-n');
    b.classList.toggle('on', !on); n.textContent = Number(n.textContent) + (on ? -1 : 1);
    const { error } = on
      ? await sb.from('suggestion_votes').delete().eq('suggestion_id', id).eq('user_id', uid)
      : await sb.from('suggestion_votes').insert({ suggestion_id: id });
    b.disabled = false;
    if (error) { alert(error.message); renderIdeas(view); }
  });
  view.querySelectorAll('[data-status]').forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from('suggestions').update({ status: sel.value }).eq('id', Number(sel.dataset.status));
    if (error) alert(error.message);
    renderIdeas(view);
  });
  view.querySelectorAll('[data-del-idea]').forEach(b => b.onclick = async () => {
    if (!confirm('Dit idee verwijderen?')) return;
    const { error } = await sb.from('suggestions').delete().eq('id', Number(b.dataset.delIdea));
    if (error) alert(error.message);
    renderIdeas(view);
  });
}

// ---------- Tab: Battle (tactisch, ronde per ronde) ----------
// Alle regels en de computer-tegenstander zitten in Supabase (schema-v9-tactical-battles.sql):
// de website stuurt enkel de gekozen zet door en speelt het resultaat af.
const TEAM_SIZE = 3;
const RARITY_ORDER = { legendary: 0, epic: 1, common: 2, cat: 3 };
const battleState = { team: [], poll: null }; // gekozen card_ids (in volgorde) + polling-timer
const DIFFS = {
  easy: { label: 'Makkelijk', coins: 5, hint: 'zwakkere kaarten' },
  normal: { label: 'Normaal', coins: 10, hint: 'zelfde zeldzaamheid' },
  hard: { label: 'Moeilijk', coins: 20, hint: 'sterkere kaarten, slimme tegenstander' },
};
const MOVES = {
  attack: { icon: '⚔️', label: 'Aanval', cost: 0, info: '+1 ⚡' },
  power: { icon: '💥', label: 'Krachtaanval', cost: 2, info: '1,7× schade · 2 ⚡' },
  guard: { icon: '🛡️', label: 'Verdedigen', cost: 0, info: 'halve schade · +2 ⚡' },
  special: { icon: '★', label: 'Special', cost: 4, info: 'door verdediging · 4 ⚡' },
  switch: { icon: '🔄', label: 'Wisselen', cost: 0, info: 'gaat eerst · +1 ⚡' },
};
const cardById = id => state.cards.find(c => c.id === Number(id));
const mySide = b => (b.player_a === state.session.user.id ? 'A' : 'B');
const otherSide = s => (s === 'A' ? 'B' : 'A');
const stopBattlePoll = () => { clearInterval(battleState.poll); battleState.poll = null; };

async function renderBattle(view) {
  stopBattlePoll();
  view.innerHTML = `<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>`;
  const uid = state.session.user.id;
  const owned = state.cards
    .filter(c => state.owned.has(c.id))
    .sort((a, b) => (RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]) || (b.attack - a.attack));
  battleState.team = battleState.team.filter(id => state.owned.has(id));

  const [friendRows, rows, board, rewards, season, seasonClaims] = await Promise.all([
    sb.from('friendships').select('friend_id').eq('user_id', uid),
    sb.from('tbattles').select('id, mode, difficulty, player_a, player_b, status, winner, round, coins_a, coins_b, forfeit, updated_at, moved:state->moved')
      .or(`player_a.eq.${uid},player_b.eq.${uid}`).order('updated_at', { ascending: false }).limit(40),
    sb.rpc('tb_leaderboard'),
    sb.rpc('tb_rewards_today'),
    state.v13 ? sb.rpc('season_state') : { data: null },
    state.v13 ? sb.rpc('claim_season_rewards') : { data: [] },
  ]);
  if (state.tab !== 'battle') return;
  for (const c of seasonClaims.data || []) {
    state.wallet += c.coins; syncCoinUI();
    toast(`🏆 Seizoen ${esc(c.season)} afgelopen: je eindigde in ${RANKS[c.rank]?.icon || ''} <strong>${RANKS[c.rank]?.name || c.rank}</strong>. +${c.coins} 🪙${c.sticker ? ` en sticker ${c.sticker.emoji}` : ''}`, 8000);
  }
  const ss = season.data;
  if (rows.error) {
    view.innerHTML = `<section class="col">${pageHead('Battle', 'battle')}<p class="msg err">Battle kon niet geladen worden: ${esc(rows.error.message)}</p></section>`;
    return;
  }
  const battles = rows.data || [];
  const friendIds = (friendRows.data || []).map(r => r.friend_id);
  const ids = [...new Set([...friendIds, ...battles.flatMap(b => [b.player_a, b.player_b])])].filter(id => id && id !== uid);
  const names = {};
  if (ids.length) {
    const { data: profs } = await sb.from('profiles').select('id, display_name').in('id', ids);
    for (const p of profs || []) names[p.id] = p.display_name;
  }
  const nameOf = id => names[id] || '…';
  const opponentOf = b => (b.mode === 'pve' ? `Computer (${DIFFS[b.difficulty]?.label || ''})` : nameOf(mySide(b) === 'A' ? b.player_b : b.player_a));

  const incoming = battles.filter(b => b.status === 'pending' && b.player_b === uid);
  const sent = battles.filter(b => b.status === 'pending' && b.player_a === uid);
  const active = battles.filter(b => b.status === 'active');
  const myTurn = active.filter(b => !(b.moved || {})[mySide(b)]);
  const waiting = active.filter(b => (b.moved || {})[mySide(b)]);
  const done = battles.filter(b => b.status === 'done').slice(0, 8);
  state.incomingBattles = incoming.length + myTurn.filter(b => b.mode === 'pvp').length;
  syncBattleBadge();
  const rw = rewards.data || { pve: 0, pve_max: 5, pvp: 0, pvp_max: 3 };

  view.innerHTML = `<section class="col" style="max-width:none">
    <div class="battle-top">
      ${pageHead('Battle', 'battle')}
      <div class="battle-bar">
        ${ss ? `<span class="pill" title="Seizoen ${esc(ss.season)}, eindigt op ${esc(ss.ends)}">${rankChip(ss.rank, ss.points)} · seizoen ${esc(ss.season)}</span>` : ''}
        <span class="pill">🪙 Vandaag beloond: computer ${rw.pve}/${rw.pve_max} · vrienden ${rw.pvp}/${rw.pvp_max}</span>
        ${state.event?.key === 'double_battle' ? '<span class="pill pill-turn">⚔️ Dubbele coins deze week!</span>' : ''}
        ${state.v13 ? soundBtn() : ''}
      </div>
    </div>

    ${myTurn.length || incoming.length ? `<div class="battle-box highlight">
      ${myTurn.map(b => `<div class="battle-row">
        <span class="battle-row-text">⚡ <strong>Jouw zet</strong> tegen ${esc(opponentOf(b))} · ronde ${b.round + 1}</span>
        <button class="btn small" data-open-battle="${b.id}" type="button">Speel verder</button>
      </div>`).join('')}
      ${incoming.map(b => `<div class="battle-row">
        <span class="battle-row-text"><strong>${esc(nameOf(b.player_a))}</strong> daagt je uit — kies je team en accepteer</span>
        <button class="btn small" data-accept-battle="${b.id}" type="button">Accepteren met mijn team</button>
        <button class="link danger" data-decline-battle="${b.id}" type="button">Weigeren</button>
      </div>`).join('')}
      <p class="msg tmsg" id="incomingMsg" role="alert"></p>
    </div>` : ''}

    ${owned.length < TEAM_SIZE
      ? `<p class="hint" style="margin-top:14px">Je hebt minstens ${TEAM_SIZE} verschillende kaarten nodig om te vechten. Je hebt er nu ${owned.length}.</p>`
      : `<div class="battle-bar" style="margin-top:14px">
          <h3 style="margin:0">Jouw team</h3>
          <span id="teamCount" class="pill"></span>
          <button class="link" id="clearTeam" type="button">Team wissen</button>
        </div>
        <p class="team-info" id="teamInfo"></p>
        <div class="battle-pick">${owned.map(c => `
          <button class="pick" type="button" data-pick="${c.id}" aria-pressed="false">
            <span class="pick-num" hidden></span>${renderCard(c, mineOpts(c))}
          </button>`).join('')}</div>
        <div class="battle-actions">
          <span class="battle-or">Tegen de computer:</span>
          ${Object.entries(DIFFS).map(([k, d]) => `<button class="btn small diff-btn" data-pve="${k}" type="button" title="${d.hint}">${d.label} <small>+${d.coins}🪙</small></button>`).join('')}
          ${friendIds.length ? `<span class="battle-or">of</span>
            <select id="battleFriend" class="tselect" style="width:auto;min-width:170px">
              <option value="">Kies een vriend…</option>
              ${friendIds.map(id => `<option value="${id}">${esc(nameOf(id))}</option>`).join('')}
            </select>
            <button class="btn small" id="challengeBattle" type="button">Uitdagen <small>+25🪙</small></button>` : ''}
        </div>
        <p class="msg tmsg" id="battleMsg" role="alert"></p>`}

    <div class="three-col" style="margin-top:14px">
      <div><h3>Wachten op zet</h3>
        ${waiting.length || sent.length ? [...waiting.map(b => `<div class="battle-row">
            <span class="battle-row-text">⏳ ${esc(opponentOf(b))} · ronde ${b.round + 1}</span>
            <button class="link" data-open-battle="${b.id}" type="button">Bekijk</button></div>`),
          ...sent.map(b => `<div class="battle-row">
            <span class="battle-row-text">✉️ Uitdaging aan <strong>${esc(nameOf(b.player_b))}</strong></span>
            <button class="link danger" data-cancel-battle="${b.id}" type="button">Annuleren</button></div>`)].join('')
          : '<p class="hint">Niets om op te wachten.</p>'}
      </div>
      <div><h3>Recente gevechten</h3>
        ${done.length ? done.map(b => {
          const won = b.winner === mySide(b);
          const coins = mySide(b) === 'A' ? b.coins_a : b.coins_b;
          return `<div class="battle-row">
            <span class="result-tag ${won ? 'won' : 'lost'}">${won ? 'Gewonnen' : 'Verloren'}</span>
            <span class="battle-row-text">${esc(opponentOf(b))}${coins ? ` · +${coins} 🪙` : ''}</span>
            <button class="link" data-open-battle="${b.id}" type="button">Bekijk</button></div>`;
        }).join('') : '<p class="hint">Nog geen gevechten.</p>'}
      </div>
      <div><h3>Ranglijst (vrienden)</h3>
        ${board.error ? `<p class="msg err">${esc(board.error.message)}</p>` : `<table class="leaderboard">
          <thead><tr><th>#</th><th>Naam</th>${state.v13 ? '<th>Rang</th>' : ''}<th>W</th><th>V</th></tr></thead>
          <tbody>${(board.data || []).map((r, i) => `<tr${r.user_id === uid ? ' class="me"' : ''}>
            <td>${i + 1}</td><td>${esc(r.display_name)}</td>${state.v13 ? `<td>${rankChip(r.rank, r.points)}</td>` : ''}<td>${r.wins}</td><td>${r.losses}</td></tr>`).join('')}</tbody>
        </table>`}
      </div>
    </div>
  </section>`;

  const teamReady = () => battleState.team.length === TEAM_SIZE;
  const sync = () => {
    view.querySelectorAll('[data-pick]').forEach(b => {
      const idx = battleState.team.indexOf(Number(b.dataset.pick));
      b.classList.toggle('selected', idx >= 0);
      b.setAttribute('aria-pressed', idx >= 0);
      const num = b.querySelector('.pick-num');
      num.hidden = idx < 0; num.textContent = idx + 1;
    });
    if ($('#teamCount')) $('#teamCount').textContent = `Team: ${battleState.team.length}/${TEAM_SIZE}`;
    if ($('#teamInfo') && state.v13) {
      const cs = battleState.team.map(cardById).filter(Boolean);
      const per = {};
      for (const c of cs) if (c.rarity !== 'cat') per[c.person] = (per[c.person] || 0) + 1;
      const syn = Object.entries(per).filter(([, n]) => n >= 2).map(([p]) => p);
      $('#teamInfo').innerHTML = syn.length
        ? `<strong>🤝 Synergie:</strong> ${syn.map(esc).join(', ')} (+10% voor die kaarten)`
        : 'Tip: 2 kaarten van dezelfde collega in je team geven 🤝 +10%. In het gevecht kies je elke ronde 🧠 Brein, 😎 Swag of 😂 Humor.';
    }
    view.querySelectorAll('[data-pve], #challengeBattle, [data-accept-battle]').forEach(b => { b.disabled = !teamReady(); });
  };
  view.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      const id = Number(b.dataset.pick);
      const idx = battleState.team.indexOf(id);
      if (idx >= 0) battleState.team.splice(idx, 1);
      else if (battleState.team.length < TEAM_SIZE) battleState.team.push(id);
      sync();
    };
  });
  if ($('#clearTeam')) $('#clearTeam').onclick = () => { battleState.team = []; sync(); };

  const msg = (sel, text, ok) => { const m = $(sel); if (m) { m.className = 'msg tmsg ' + (ok ? 'ok' : 'err'); m.textContent = text; } };
  view.querySelectorAll('[data-pve]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data, error } = await sb.rpc('tb_start_pve', { p_cards: battleState.team, p_difficulty: b.dataset.pve });
    if (error) { msg('#battleMsg', error.message); b.disabled = false; return; }
    openBattle(view, data);
  });
  if ($('#challengeBattle')) $('#challengeBattle').onclick = async () => {
    const fid = $('#battleFriend').value;
    if (!fid) return msg('#battleMsg', 'Kies eerst een vriend.');
    const { error } = await sb.rpc('tb_challenge', { p_friend: fid, p_cards: battleState.team });
    if (error) return msg('#battleMsg', error.message);
    msg('#battleMsg', `Uitdaging verstuurd naar ${nameOf(fid)}!`, true);
    setTimeout(() => { if ($('#battleMsg')) renderBattle(view); }, 1200);
  };
  view.querySelectorAll('[data-open-battle]').forEach(b => { b.onclick = () => openBattle(view, Number(b.dataset.openBattle)); });
  view.querySelectorAll('[data-cancel-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('tb_respond', { p_id: Number(b.dataset.cancelBattle), p_action: 'cancel' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-decline-battle]').forEach(b => b.onclick = async () => {
    if (!confirm('Deze uitdaging weigeren?')) return;
    b.disabled = true;
    const { error } = await sb.rpc('tb_respond', { p_id: Number(b.dataset.declineBattle), p_action: 'decline' });
    if (error) { alert(error.message); b.disabled = false; return; }
    renderBattle(view);
  });
  view.querySelectorAll('[data-accept-battle]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const id = Number(b.dataset.acceptBattle);
    const { error } = await sb.rpc('tb_respond', { p_id: id, p_action: 'accept', p_cards: battleState.team });
    if (error) { msg('#incomingMsg', error.message); b.disabled = false; return; }
    openBattle(view, id);
  });
  sync();
}

// ---------- Speelscherm ----------
function eventText(e, b, names) {
  const me = mySide(b);
  const who = s => `<span class="who">${esc(s === me ? 'Jij' : names.opp)}</span>`;
  const st = b.state;
  const card = (s, i) => cardById(st[s].cards[i]);
  const nm = (s, i) => esc(card(s, i)?.name || '?');
  if (e.t === 'rps') {
    const mine = me === 'A' ? e.a : e.b, theirs = me === 'A' ? e.b : e.a;
    const res = !e.w ? 'gelijkspel' : e.w === me ? '<strong>jij wint de ronde</strong>' : `<strong>${esc(names.opp)} wint de ronde</strong>`;
    return `<span class="who">⚖️</span> ${RPS[mine]?.icon} ${RPS[mine]?.name} tegen ${RPS[theirs]?.icon} ${RPS[theirs]?.name}: ${res}`;
  }
  if (e.t === 'atk' && RPS[e.k]) {
    const c = card(e.s, e.ai ?? st[e.s].active);
    return `${who(e.s)} ${esc(c?.name || '?')} ${RPS[e.k].icon} ${e.tie ? 'raakt ook' : 'valt aan'}: ${e.d} schade${e.crit ? ' — voltreffer!' : ''}`;
  }
  if (e.t === 'atk') {
    const c = card(e.s, e.ai ?? st[e.s].active);
    const how = e.k === 'special' ? `★ <strong>${esc(abilityOf(c)?.name || 'Special')}</strong>` : e.k === 'power' ? '💥 krachtaanval' : 'valt aan';
    const eff = '';
    return `${who(e.s)} ${esc(c?.name || '?')} ${how}: ${e.d} schade${eff}${e.crit ? ' — voltreffer!' : ''}${e.guarded ? ' (verdedigd)' : ''}${e.abs ? ` (🛡️ ving ${e.abs} op)` : ''}`;
  }
  if (e.t === 'guard') return `${who(e.s)} 🛡️ verdedigt`;
  if (e.t === 'switch') return `${who(e.s)} 🔄 wisselt naar ${nm(e.s, e.i)}`;
  if (e.t === 'ko') return `${who(e.s)} <strong>${nm(e.s, e.i)}</strong> is uitgeschakeld!`;
  if (e.t === 'enter') return `${who(e.s)} ${nm(e.s, e.i)} komt de arena in`;
  if (e.t === 'forfeit') return `${who(e.s)} geeft op`;
  if (e.t === 'end') return `<strong>${e.w === me ? 'Jij wint!' : `${esc(names.opp)} wint.`}</strong>`;
  return '';
}

// Statussen van één kaart (brand, verdoofd, schild, synergie)
function statusHtml(disp, side, i, round, small = false) {
  const out = [];
  if ((disp.burn[i] || 0) > 0) out.push(`<span class="st burn" title="Brand: verliest elke ronde HP">🔥${small ? '' : ' ' + disp.burn[i]}</span>`);
  if ((disp.stun[i] || 0) > round) out.push(`<span class="st stun" title="Verdoofd: kan volgende ronde niet aanvallen">💫${small ? '' : ' verdoofd'}</span>`);
  if ((disp.shield[i] || 0) > 0) out.push(`<span class="st shield" title="Schild: vangt schade op">🛡️ ${disp.shield[i]}</span>`);
  if (!small && (side.syn || [])[i]) out.push('<span class="st syn" title="Synergie: +10%">🤝</span>');
  return out.join('');
}

// Toont een kant (links = jij) op basis van een weergave-toestand {active, hp[], energy, burn[], stun[], shield[]}
function sideHtml(b, s, disp, mine) {
  const side = b.state[s];
  const c = cardById(side.cards[disp.active]);
  const hp = disp.hp[disp.active], max = side.max[disp.active];
  const pct = Math.max(0, hp / max * 100);
  const rps = isRps(b);
  return `<div class="bt-name">${mine ? 'Jij' : esc(disp.name)}</div>
    <div class="fighter-card" data-active="${disp.active}">${c ? renderCard(c, { level: (side.lvl || [])[disp.active] || 1 }) : ''}</div>
    <div class="hpbar"><div class="hpfill${pct <= 25 ? ' low' : pct <= 50 ? ' mid' : ''}" style="width:${pct}%"></div></div>
    <div class="hptext">HP ${hp} / ${max}</div>
    <div class="status-row">${statusHtml(disp, side, disp.active, b.round)}</div>
    ${rps ? '' : `<div class="energy" title="Energie">${Array.from({ length: 5 }, (_, i) => `<span class="pip${i < disp.energy ? ' on' : ''}">⚡</span>`).join('')}</div>`}
    <div class="bench">${side.cards.map((id, i) => {
      if (i === disp.active) return '';
      const bc = cardById(id), bh = disp.hp[i];
      return `<button type="button" class="bench-card${bh <= 0 ? ' out' : ''}" data-bench="${i}" ${mine && bh > 0 && !rps ? '' : 'disabled'}>
        <span>${esc(bc?.name || '?')}</span><span class="bench-hp">${statusHtml(disp, side, i, b.round, true)} ${bh > 0 ? `${bh} HP` : 'uitgeschakeld'}</span></button>`;
    }).join('')}</div>`;
}

async function openBattle(view, id, prev = null) {
  stopBattlePoll();
  const { data: b, error } = await sb.from('tbattles').select('*').eq('id', id).single();
  if (error) { alert(error.message); return renderBattle(view); }
  if (b.status === 'pending') { alert('Deze uitdaging is nog niet geaccepteerd.'); return renderBattle(view); }
  const me = mySide(b), op = otherSide(me);
  let oppName = 'Computer';
  if (b.mode === 'pvp') {
    const { data: p } = await sb.from('profiles').select('display_name').eq('id', me === 'A' ? b.player_b : b.player_a).maybeSingle();
    oppName = p?.display_name || 'Tegenstander';
  }
  const names = { opp: oppName };
  const title = b.mode === 'pve' ? `Tegen de computer · ${DIFFS[b.difficulty]?.label || ''}` : `Tegen ${esc(oppName)}`;

  // Weergave-toestand: bij een nieuwe ronde starten we van de vorige en spelen we de gebeurtenissen af
  const fromState = (prev && prev.round < b.round) ? prev.state : b.state;
  const arr = (side, k) => [...(side[k] || side.hp.map(() => 0))];
  const mkDisp = (side, name) => ({ active: side.active, hp: [...side.hp], energy: side.energy, name,
    burn: arr(side, 'burn'), stun: arr(side, 'stun'), shield: arr(side, 'shield') });
  const disp = { A: mkDisp(fromState.A, me === 'A' ? 'Jij' : oppName), B: mkDisp(fromState.B, me === 'B' ? 'Jij' : oppName) };
  const events = b.state.events || [];
  const newEvents = (prev && prev.round < b.round) ? events.filter(e => e.r > prev.round) : [];

  view.innerHTML = `<section class="col" style="max-width:none">
    <div class="bt-head">
      <button class="link" id="btBack" type="button">← Battle</button>
      <h2>${title}</h2>
      <span class="pill" id="btRound">Ronde ${b.round + (b.status === 'active' ? 1 : 0)}</span>
      ${state.v13 ? soundBtn() : ''}
      ${b.status === 'active' ? '<button class="link danger forfeit" id="btForfeit" type="button">Opgeven</button>' : ''}
    </div>
    <div class="bt-layout">
      <div>
        <div class="arena bt-arena">
          <div class="fighter bt-side" id="side-me"></div>
          <div class="vs" aria-hidden="true">VS</div>
          <div class="fighter bt-side" id="side-op"></div>
        </div>
        <p class="msg" id="btMsg" role="status" style="margin:8px 0 0"></p>
        <div class="bt-actions" id="btActions"></div>
      </div>
      <div>
        <div id="battleResult"></div>
        <ol class="battle-log" id="battleLog" aria-live="polite"></ol>
      </div>
    </div>
  </section>`;
  $('#btBack').onclick = () => { stopBattlePoll(); renderBattle(view); };

  const drawSides = () => {
    $('#side-me').innerHTML = sideHtml(b, me, disp[me], true);
    $('#side-op').innerHTML = sideHtml(b, op, disp[op], false);
  };
  const log = $('#battleLog');
  // Verslag per ronde: nieuwste ronde bovenaan, binnen een ronde in volgorde van gebeuren
  const addLog = (e) => {
    const t = eventText(e, b, names);
    if (!t) return;
    let block = log.querySelector(`[data-round="${e.r}"]`);
    if (!block) {
      block = document.createElement('li');
      block.className = 'round-block'; block.dataset.round = e.r;
      block.innerHTML = `<div class="round-title">Ronde ${e.r}</div><ol class="round-lines"></ol>`;
      log.prepend(block);
    }
    const li = document.createElement('li');
    li.innerHTML = t; li.className = e.s === me ? 'mine' : e.s ? 'theirs' : 'ko-line';
    if (e.t === 'ko' || e.t === 'end') li.className = 'ko-line';
    block.querySelector('.round-lines').appendChild(li);
  };
  // Oude gebeurtenissen meteen in het verslag (zonder animatie)
  const cutoff = newEvents.length ? prev.round : Infinity;
  for (const e of events) if (e.r <= cutoff) addLog(e);
  drawSides();

  // Nieuwe ronde afspelen
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sideEl = s => $(s === me ? '#side-me' : '#side-op');
  const pop = (s, text, cls = '') => {
    if (reduce) return;
    const el = document.createElement('span');
    el.className = 'dmg-pop ' + cls; el.textContent = text;
    sideEl(s)?.querySelector('.fighter-card')?.appendChild(el);
  };
  const banner = (text, cls) => {
    if (reduce) return;
    const el = document.createElement('div');
    el.className = 'bt-banner ' + cls; el.textContent = text;
    $('.bt-arena')?.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  };
  for (const e of newEvents) {
    const d = e.s ? otherSide(e.s) : null;
    if (e.t === 'switch' || e.t === 'enter') disp[e.s].active = e.i;
    if (e.t === 'atk') {
      const di = e.di ?? disp[d].active;
      disp[d].hp[di] = e.hp;
      if (e.abs) disp[d].shield[di] = Math.max(0, (disp[d].shield[di] || 0) - e.abs);
    }
    if (e.t === 'ability') { disp[e.s].hp[e.i] = e.hp; disp[e.s].shield[e.i] = e.shield; }
    if (e.t === 'shield') disp[e.s].shield[e.i] = e.v;
    if (e.t === 'burn') disp[e.s].burn[e.i] = 3;
    if (e.t === 'burnt') { disp[e.s].hp[e.i] = e.hp; disp[e.s].burn[e.i] = Math.max(0, (disp[e.s].burn[e.i] || 0) - 1); }
    if (e.t === 'stun') disp[e.s].stun[e.i] = e.r + 1;
    addLog(e);
    drawSides();
    if (!reduce && e.t === 'rps') {
      const mine = me === 'A' ? e.a : e.b, theirs = me === 'A' ? e.b : e.a;
      const el = document.createElement('div');
      el.className = 'rps-clash';
      el.innerHTML = `<span class="rc-me${e.w === me ? ' win' : e.w ? ' lose' : ''}">${RPS[mine].icon}</span><span class="rc-vs">VS</span><span class="rc-op${e.w && e.w !== me ? ' win' : e.w ? ' lose' : ''}">${RPS[theirs].icon}</span>
        <strong>${!e.w ? 'Gelijkspel!' : e.w === me ? 'Jij wint de ronde!' : `${esc(oppName)} wint de ronde!`}</strong>`;
      $('.bt-arena')?.appendChild(el);
      SFX.play(e.w === me ? 'coin' : e.w ? 'stun' : 'tick');
      await sleep(1300);
      el.remove();
      if (!$('#battleLog')) return;
      continue;
    }
    if (!reduce) {
      if (e.t === 'atk') {
        // Aanvaller springt naar voren, doelwit schudt
        const att = sideEl(e.s)?.querySelector('.fighter-card');
        att?.classList.add(e.s === me ? 'lunge-r' : 'lunge-l');
        const target = sideEl(d);
        pop(d, `-${e.d}`, e.k !== 'attack' || e.crit ? 'big' : '');
        if (e.abs) setTimeout(() => pop(d, `🛡️ ${e.abs}`, 'shield'), 150);
        target.classList.remove('hit'); void target.offsetWidth; target.classList.add('hit');
        if (e.crit) { banner('VOLTREFFER!', 'crit'); $('.bt-arena')?.classList.remove('quake'); void $('.bt-arena')?.offsetWidth; $('.bt-arena')?.classList.add('quake'); }
        else if (e.eff === 1) banner('Super effectief!', 'up');
        else if (e.eff === -1) banner('Niet zo effectief…', 'down');
        SFX.play(e.crit ? 'crit' : 'hit');
      }
      if (e.t === 'ability') { pop(e.s, `+${e.heal}`, 'heal'); setTimeout(() => pop(e.s, '🛡️', 'shield'), 200); SFX.play('heal'); }
      if (e.t === 'shield') { pop(e.s, '🛡️', 'shield'); SFX.play('shield'); }
      if (e.t === 'burn') { pop(e.s, '🔥', 'burn'); SFX.play('burn'); }
      if (e.t === 'burnt') { pop(e.s, `🔥-${e.d}`, 'burn'); SFX.play('burn'); }
      if (e.t === 'stun' || e.t === 'stunned') { pop(e.s, '💫', 'stun'); SFX.play('stun'); }
      if (e.t === 'ko') { sideEl(e.s)?.classList.add('ko'); SFX.play('ko'); }
      if (e.t === 'end') SFX.play(e.w === me ? 'win' : 'lose');
      await sleep(e.t === 'atk' ? 850 : e.t === 'end' ? 300 : 550);
    }
    if (!$('#battleLog')) return; // intussen weggeklikt
  }
  // Eindtoestand (energie e.d.) tonen
  for (const s of ['A', 'B']) Object.assign(disp[s], mkDisp(b.state[s], disp[s].name));
  drawSides();

  const actions = $('#btActions'), msg = $('#btMsg');
  if (b.status === 'done') {
    const won = b.winner === me;
    const coins = me === 'A' ? b.coins_a : b.coins_b;
    if (coins) {
      const { data: w } = await sb.from('user_wallet').select('polycoins').eq('user_id', state.session.user.id).maybeSingle();
      if (w) { state.wallet = w.polycoins; syncCoinUI(); }
    }
    if (won && newEvents.length && !reduce) $('#battleResult').insertAdjacentHTML('beforebegin', confettiHtml());
    $('#battleResult').innerHTML = `<div class="battle-result ${won ? 'won' : 'lost'}">
      <h3>${won ? 'Gewonnen!' : 'Verloren…'}</h3>
      <p>${b.forfeit ? (won ? `${esc(oppName)} gaf op.` : 'Je gaf op.') : won ? `Je team heeft ${esc(oppName)} verslagen.` : `${esc(oppName)} was deze keer sterker.`}
        ${coins ? `<strong>+${coins} polycoins!</strong>` : won ? '(Je daglimiet voor beloningen is bereikt.)' : ''}</p>
      <div class="battle-bar">
        ${b.mode === 'pve' ? `<button class="btn small" id="btAgain" type="button">Opnieuw (${DIFFS[b.difficulty].label})</button>` : ''}
        <button class="link" id="btBack2" type="button">Terug naar Battle</button>
      </div></div>`;
    $('#btBack2').onclick = () => renderBattle(view);
    if ($('#btAgain')) $('#btAgain').onclick = async () => {
      const cards = b.state[me].cards;
      const { data, error: e2 } = await sb.rpc('tb_start_pve', { p_cards: cards, p_difficulty: b.difficulty });
      if (e2) { alert(e2.message); return; }
      openBattle(view, data);
    };
    return;
  }

  const waiting = (b.state.moved || {})[me];
  if (waiting) {
    actions.innerHTML = '';
    msg.className = 'msg'; msg.textContent = `Je zet is gekozen. Wachten op ${oppName}…`;
    if ($('#btForfeit')) $('#btForfeit').onclick = async () => {
      if (!confirm('Wil je echt opgeven?')) return;
      const { error: ef } = await sb.rpc('tb_act', { p_id: b.id, p_action: 'forfeit' });
      if (ef) { msg.className = 'msg err'; msg.textContent = ef.message; return; }
      openBattle(view, b.id, b);
    };
    // Af en toe kijken of de tegenstander al gekozen heeft
    battleState.poll = setInterval(async () => {
      if (!$('#btActions')) return stopBattlePoll();
      const { data: n } = await sb.from('tbattles').select('round, status').eq('id', b.id).single();
      if (n && (n.round !== b.round || n.status !== b.status)) { stopBattlePoll(); openBattle(view, b.id, b); }
    }, 4000);
    return;
  }

  const side = b.state[me], a = side.active;
  if (isRps(b)) {
    actions.innerHTML = `<div class="rps-row">${Object.entries(RPS).map(([k, m]) => `<button type="button" class="rps-btn rps-${k}" data-move="${k}">
      <span class="rps-icon">${m.icon}</span><strong>${m.name}</strong><small>${m.hint}</small></button>`).join('')}</div>`;
    msg.className = 'msg'; msg.textContent = 'Kies je zet: wie de ronde wint, valt aan. Gelijkspel = allebei een kleine klap.';
    const sendRps = async move => {
      actions.querySelectorAll('button').forEach(x => { x.disabled = true; });
      actions.querySelector(`[data-move="${move}"]`)?.classList.add('picked');
      const { error: e3 } = await sb.rpc('tb_act', { p_id: b.id, p_action: move });
      if (e3) { msg.className = 'msg err'; msg.textContent = e3.message; openBattle(view, b.id); return; }
      openBattle(view, b.id, b);
    };
    actions.querySelectorAll('[data-move]').forEach(btn => { btn.onclick = () => sendRps(btn.dataset.move); });
    if ($('#btForfeit')) $('#btForfeit').onclick = () => { if (confirm('Wil je echt opgeven?')) sendRps('forfeit'); };
    return;
  }
  const myCard = cardById(side.cards[a]);
  const hasAb = side.ab ? !!side.ab[a] : side.sp[a] > 0;
  const ab = hasAb ? (abilityOf(myCard) || { name: 'Special', cost: 4, info: '4 ⚡' }) : null;
  if (ab && side.ab) ab.cost = side.ab[a] === 'epic' ? 3 : 4;
  const stunned = (side.stun || [])[a] === b.round + 1;
  const can = {
    attack: !stunned, guard: true,
    power: !stunned && side.energy >= 2,
    special: !stunned && !!ab && side.energy >= ab.cost,
    switch: side.hp.some((h, i) => i !== a && h > 0),
  };
  actions.innerHTML = Object.entries(MOVES).map(([k, m]) => (k === 'special' && !ab) ? '' :
    `<button type="button" class="move-btn" data-move="${k}" ${can[k] ? '' : 'disabled'}>
      <span class="move-icon">${m.icon}</span><span>${k === 'special' ? esc(ab.name) : m.label}</span><small>${k === 'special' ? esc(ab.info) : m.info}</small></button>`).join('');
  msg.className = 'msg';
  msg.textContent = stunned ? '💫 Je kaart is verdoofd: verdedig of wissel deze ronde.' : 'Kies je zet.';

  const send = async (move, target = null) => {
    actions.querySelectorAll('button').forEach(x => { x.disabled = true; });
    msg.textContent = 'Bezig…';
    const { data: nb, error: e3 } = await sb.rpc('tb_act', { p_id: b.id, p_action: move, p_target: target });
    if (e3) { msg.className = 'msg err'; msg.textContent = e3.message; openBattle(view, b.id); return; }
    openBattle(view, b.id, b);
  };
  if ($('#btForfeit')) $('#btForfeit').onclick = () => { if (confirm('Wil je echt opgeven?')) send('forfeit'); };
  actions.querySelectorAll('[data-move]').forEach(btn => {
    btn.onclick = () => {
      const move = btn.dataset.move;
      if (move === 'switch') {
        msg.textContent = 'Kies op je bank de kaart waarnaar je wil wisselen.';
        $('#side-me').classList.add('choosing');
        $('#side-me').querySelectorAll('[data-bench]:not([disabled])').forEach(bc => {
          bc.onclick = () => send('switch', Number(bc.dataset.bench));
        });
        return;
      }
      send(move);
    };
  });
}

    const { data, error } = await sb.rpc('casino_slots', { p_bet: casino.bet });
    if (error) { msg.className = 'msg err'; msg.textContent = error.message; b.disabled = false; return; }
    state.wallet -= casino.bet; syncCoinUI();
    $('#lever')?.classList.add('pulled'); setTimeout(() => $('#lever')?.classList.remove('pulled'), 350);

      const r = $('#reel' + i); if (r) { r.textContent = SLOT_SYMS[Math.floor(Math.random() * 6)]; r.classList.add('spinning'); }

  const BJ_CHIPS = [10, 25, 50, 100];
  const BJ_RES = { won: ['🎉 Gewonnen!', 'ok'], lost: ['😬 Verloren', 'err'], push: ['🤝 Gelijkspel: inzet terug', ''], blackjack: ['🃏 BLACKJACK!', 'ok'] };
  casino.bjStack = casino.bjStack || [];
  const STEP = 280;
  const handHtml = (cards, oldLen, delays, revealIdx = -1) => cards.map((c, i) => {
    const anim = i === revealIdx ? ' reveal' : i >= oldLen ? ' new' : '';
    return playingCard(c, i).replace('class="pcard', `class="pcard${anim}`).replace('style="', `style="--d:${anim ? delays.shift() : 0}ms;`);
  }).join('');
  const stackHtml = chips => chips.map((v, k) => `<span class="mini-chip" data-v="${v}" style="--k:${k}"></span>`).join('');

  const drawBj = (g, prev = null, instant = false) => {
    const box = $('#bjTable'); if (!box) return;
    const playing = g.status === 'playing';
    const fresh = !prev || prev.status !== 'playing';
    let oldP = fresh ? 0 : prev.player.length, oldD = fresh ? 0 : prev.dealer.length, revealIdx = -1, t = 0;
    const pD = [], dD = [];
    if (instant || g.status === 'none') { oldP = (g.player || []).length; oldD = (g.dealer || []).length; }
    else if (fresh) {
      // Delen in de echte volgorde: jij, dealer, jij, dealer (verborgen)
      for (let i = 0; i < 2; i++) { pD.push(t); t += STEP; dD.push(t); t += STEP; }
      for (let i = 2; i < g.dealer.length; i++) { dD.push(t); t += STEP * 2; }
    } else {
      for (let i = oldP; i < g.player.length; i++) { pD.push(t); t += STEP; }
      if (!playing && prev.dealer.includes(-1)) { revealIdx = 1; t += 250; dD.push(t); t += STEP * 2; }
      for (let i = oldD; i < g.dealer.length; i++) { dD.push(t); t += STEP * 2; }
    }
    const pTimes = [...pD], dTimes = [...dD];
    const total = t + (t ? 350 : 0);

    const betNow = casino.bjStack.reduce((x, y) => x + y, 0);
    box.innerHTML = `
      ${g.status === 'none' ? '<p class="hint">Kom zo dicht mogelijk bij 21 zonder erover te gaan.</p>' : `
        <div class="bj-row"><span class="bj-label">Dealer <b id="bjDT">${instant ? (playing ? g.dtotal + '+' : g.dtotal) : ''}</b></span>
          <div class="bj-cards">${handHtml(g.dealer, oldD, dD, revealIdx)}</div></div>
        <div class="bj-row"><span class="bj-label">Jij <b id="bjPT">${instant ? g.ptotal : ''}</b></span>
          <div class="bj-cards">${handHtml(g.player, oldP, pD)}</div></div>
        <div class="bj-result" id="bjResult"></div>`}
      <div class="bj-bet-area">
        <div class="bet-circle" title="Inzet"><div class="bet-stack">${playing ? stackHtml(casino.bjPlaced || []) : stackHtml(casino.bjStack)}</div>
          <span class="bet-amount">${playing ? g.bet : betNow || 'INZET'}</span></div>
        <div class="bj-controls" id="bjControls"></div>
      </div>
      <p class="msg" id="bjMsg" role="status"></p>`;

    // Geluid per kaart en totalen pas tonen als de kaarten liggen
    [...pTimes, ...dTimes].forEach(d => setTimeout(() => SFX.play('flip'), d));
    setTimeout(() => {
      if (!$('#bjTable')) return;
      if (g.status === 'none') return drawControls();
      const pt = $('#bjPT'), dt = $('#bjDT');
      if (pt) pt.textContent = g.ptotal;
      if (dt) dt.textContent = playing ? `${g.dtotal}+` : g.dtotal;
      if (!playing) {
        const [txt, cls] = BJ_RES[g.status] || ['', ''];
        $('#bjResult').innerHTML = `<span class="${cls}">${txt}${g.payout ? ` <strong>+${g.payout} 🪙</strong>` : ''}</span>`;
      }
      if (!playing && !instant) {
        setWallet(g.wallet);
        SFX.play(['won', 'blackjack'].includes(g.status) ? (g.status === 'blackjack' ? 'jackpot' : 'win') : g.status === 'lost' ? 'lose' : 'coin');
      }
      drawControls();
    }, instant ? 0 : total);

    const drawControls = () => {
      const ctl = $('#bjControls'); if (!ctl) return;
      if (playing) {
        ctl.innerHTML = `<div class="battle-bar bj-actions">
          <button class="btn small" data-bj="hit" type="button">Kaart</button>
          <button class="btn small" data-bj="stand" type="button">Passen</button>
          ${g.can_double ? `<button class="btn small" data-bj="double" type="button" ${state.wallet < g.bet ? 'disabled' : ''}>Verdubbelen</button>` : ''}</div>`;
        ctl.querySelectorAll('[data-bj]').forEach(b => b.onclick = async () => {
          ctl.querySelectorAll('button').forEach(x => { x.disabled = true; });
          const { data, error } = await sb.rpc('bj_action', { p_action: b.dataset.bj });
          if (error) { $('#bjMsg').className = 'msg err'; $('#bjMsg').textContent = error.message; drawControls(); return; }
          if (b.dataset.bj === 'double') { casino.bjPlaced = [...(casino.bjPlaced || []), ...(casino.bjPlaced || [])]; state.wallet -= g.bet; syncCoinUI(); }
          drawBj(data, g);
        });
        return;
      }
      const sum = casino.bjStack.reduce((x, y) => x + y, 0);
      ctl.innerHTML = `<div class="bj-chips">${BJ_CHIPS.map(v => `<button type="button" class="chip" data-chip="${v}" ${sum + v > 200 || sum + v > state.wallet ? 'disabled' : ''}>${v}</button>`).join('')}</div>
        <div class="battle-bar bj-actions">
          <button class="link" id="bjClear" type="button" ${sum ? '' : 'disabled'}>Wis</button>
          ${casino.bjLast ? `<button class="link" id="bjRebet" type="button" ${sum ? 'hidden' : ''}>Zelfde inzet (${casino.bjLast.reduce((x, y) => x + y, 0)})</button>` : ''}
          <button class="btn small" id="bjDeal" type="button" ${sum >= 10 ? '' : 'disabled'}>Delen</button></div>
        <small class="hint" style="margin:0">Leg fiches op het vak (max 200). Blackjack betaalt 3:2.</small>`;
      // Enkel bijwerken (niet opnieuw tekenen), zodat snel klikken op fiches altijd telt
      const refreshBet = () => {
        const s2 = casino.bjStack.reduce((x, y) => x + y, 0);
        const circle = box.querySelector('.bet-circle');
        circle.querySelector('.bet-stack').innerHTML = stackHtml(casino.bjStack);
        circle.querySelector('.bet-amount').textContent = s2 || 'INZET';
        ctl.querySelectorAll('[data-chip]').forEach(c => { c.disabled = s2 + Number(c.dataset.chip) > 200 || s2 + Number(c.dataset.chip) > state.wallet; });
        $('#bjClear').disabled = !s2;
        $('#bjDeal').disabled = s2 < 10;
        if ($('#bjRebet')) $('#bjRebet').hidden = s2 > 0;
      };
      ctl.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => { casino.bjStack.push(Number(c.dataset.chip)); SFX.play('tick'); refreshBet(); });
      if ($('#bjClear')) $('#bjClear').onclick = () => { casino.bjStack = []; refreshBet(); };
      if ($('#bjRebet')) $('#bjRebet').onclick = () => { casino.bjStack = [...casino.bjLast]; refreshBet(); };
      $('#bjDeal').onclick = async () => {
        const bet = casino.bjStack.reduce((x, y) => x + y, 0);
        $('#bjDeal').disabled = true;
        const { data, error } = await sb.rpc('bj_start', { p_bet: bet });
        if (error) { $('#bjMsg').className = 'msg err'; $('#bjMsg').textContent = error.message; drawControls(); return; }
        casino.bjLast = [...casino.bjStack]; casino.bjPlaced = [...casino.bjStack]; casino.bjStack = [];
        state.wallet -= bet; syncCoinUI();
        drawBj(data, null);
      };
    };
  };
  if (!bj.error && bj.data?.status === 'playing') casino.bjPlaced = casino.bjPlaced || [bj.data.bet];
  drawBj(bj.error ? { status: 'none' } : bj.data, null, true);

  // Krasbiljet
  const scratchAll = $('#scratchAll');
  $('#buyScratch').onclick = async () => {
    const b = $('#buyScratch'); b.disabled = true;
    const msg = $('#scratchMsg'); msg.className = 'msg'; msg.textContent = '';
    const { data, error } = await sb.rpc('casino_scratch');
    if (error) { msg.className = 'msg err'; msg.textContent = error.message; b.disabled = false; return; }
    state.wallet -= 25; syncCoinUI();
    const box = $('#scratchBox');
    box.innerHTML = `<div class="scratch-card">${data.symbols.map((k, i) =>
      `<div class="scratch-cell" data-k="${k}"><span class="scratch-sym">${SCRATCH_SYMS[k]}</span><canvas data-cell="${i}"></canvas></div>`).join('')}</div>`;
    let revealed = false;
    const finish = async () => {
      if (revealed) return; revealed = true;
      box.querySelectorAll('canvas').forEach(c => c.classList.add('gone'));
      scratchAll.hidden = true;
      if (data.win) box.querySelectorAll(`[data-k="${data.win}"]`).forEach(c => c.classList.add('match'));
      setWallet(data.wallet);
      msg.className = data.win ? 'msg ok' : 'msg';
      msg.innerHTML = data.win ? (data.prize ? `🎉 Je wint <strong>${data.prize}</strong> polycoins!` : '🎉 Je wint een zeldzame sticker!') : 'Helaas, geen 3 dezelfde.';
      SFX.play(data.win ? 'jackpot' : 'lose');
      b.disabled = false; b.textContent = 'Nog een biljet · 25 🪙';
      if (data.sticker) await showStickers([data.sticker], 'Krasbiljet');
    };
    const cleared = new Set();
    box.querySelectorAll('canvas').forEach(cv => {
      const r = cv.parentElement.getBoundingClientRect();
      cv.width = r.width; cv.height = r.height;
      const ctx = cv.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, cv.width, cv.height);
      g.addColorStop(0, '#b9bec6'); g.addColorStop(.5, '#e6e9ee'); g.addColorStop(1, '#9aa1ab');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.font = '700 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('KRAS', cv.width / 2, cv.height / 2 + 4);
      ctx.globalCompositeOperation = 'destination-out';
      let down = false, strokes = 0;
      const scratch = e => {
        if (!down || revealed) return;
        const rr = cv.getBoundingClientRect();
        ctx.beginPath(); ctx.arc(e.clientX - rr.left, e.clientY - rr.top, 14, 0, Math.PI * 2); ctx.fill();
        if (++strokes % 6 === 0) SFX.play('tick');
        if (strokes > 18 && !cleared.has(cv)) { cleared.add(cv); cv.classList.add('gone'); if (cleared.size === 6) finish(); }
      };
      cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); scratch(e); });
      cv.addEventListener('pointermove', scratch);
      cv.addEventListener('pointerup', () => { down = false; });
    });
    scratchAll.hidden = false;
    scratchAll.onclick = finish;
  };
}

// --- Verbanden ---
async function drawConn(body, view) {
  body.innerHTML = '<p class="hint">Laden…</p>';
  const { data, error } = await sb.rpc('conn_state');
  if (error) { body.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  const words = data.words;
  if (!puz.order || puz.order.some(w => !words.includes(w)) || puz.order.length !== words.length) puz.order = [...words];
  puz.sel = new Set([...puz.sel].filter(w => words.includes(w)));
  const groupBar = g => `<div class="conn-group l${g.l}"><strong>${esc(g.t)}</strong><span>${g.w.map(esc).join(', ')}</span></div>`;
  const left = 4 - data.mistakes;
  body.innerHTML = `<div class="conn">
    <p class="hint">Vind 4 groepjes van 4 woorden die iets gemeen hebben. Je mag 4 fouten maken. Geel is het makkelijkst, paars het moeilijkst.</p>
    <div class="conn-solved">${data.solved.map(groupBar).join('')}${(data.revealed || []).map(g => groupBar(g).replace('conn-group', 'conn-group missed')).join('')}</div>
    ${data.status === 'playing' ? `
      <div class="conn-grid" id="connGrid">${puz.order.map(w => `<button type="button" class="conn-word${puz.sel.has(w) ? ' on' : ''}${w.length > 10 ? ' long' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
      <div class="conn-foot">
        <span class="conn-lives">Fouten over: ${'<span class="life"></span>'.repeat(left)}${'<span class="life lost"></span>'.repeat(4 - left)}</span>
        <div class="battle-bar">
          <button class="link" id="connShuffle" type="button">🔀 Schudden</button>
          <button class="link" id="connClear" type="button">Wis selectie</button>
          <button class="btn small" id="connSubmit" type="button" ${puz.sel.size === 4 ? '' : 'disabled'}>Indienen</button>
        </div>
      </div>` : `<p class="msg ${data.status === 'won' ? 'ok' : 'err'}">${data.status === 'won'
        ? `Opgelost met ${data.mistakes} ${data.mistakes === 1 ? 'fout' : 'fouten'}! Je kreeg ${data.reward} 🪙. Morgen een nieuwe.`
        : `Helaas, 4 fouten. Hierboven zie je de oplossing. Je kreeg ${data.reward} 🪙 als troost.`}</p>`}
    <p class="msg" id="connMsg" role="status"></p>
  </div>`;
  if (data.status !== 'playing') return;
  const sync = () => {
    body.querySelectorAll('.conn-word').forEach(b => b.classList.toggle('on', puz.sel.has(b.dataset.w)));
    $('#connSubmit').disabled = puz.sel.size !== 4;
  };
  body.querySelectorAll('.conn-word').forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    if (puz.sel.has(w)) puz.sel.delete(w); else if (puz.sel.size < 4) puz.sel.add(w);
    SFX.play('tick'); sync();
  });
  $('#connShuffle').onclick = () => { puz.order.sort(() => Math.random() - .5); drawConnGrid(); };
  const drawConnGrid = () => {
    $('#connGrid').innerHTML = puz.order.map(w => `<button type="button" class="conn-word${puz.sel.has(w) ? ' on' : ''}${w.length > 10 ? ' long' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('');
    body.querySelectorAll('.conn-word').forEach(b => b.onclick = () => {
      const w = b.dataset.w;
      if (puz.sel.has(w)) puz.sel.delete(w); else if (puz.sel.size < 4) puz.sel.add(w);
      SFX.play('tick'); sync();
    });
  };
  $('#connClear').onclick = () => { puz.sel.clear(); sync(); };
  $('#connSubmit').onclick = async () => {
    $('#connSubmit').disabled = true;
    const { data: r, error: e2 } = await sb.rpc('conn_guess', { p_words: [...puz.sel] });
    const msg = $('#connMsg');
    if (e2) { msg.className = 'msg err'; msg.textContent = e2.message; return; }
    if (r.correct) {
      SFX.play('coin');
      puz.sel.clear();
      await drawConn(body, view);
      if (r.prize) { await puzzlePrize(r.prize); renderPuzzles(view); }
      return;
    }
    SFX.play('lose');
    body.querySelectorAll('.conn-word.on').forEach(b => { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); });
    await sleep(500);
    if (r.state.status !== 'playing') { puz.sel.clear(); renderPuzzles(view); return; }
    await drawConn(body, view);
    const m2 = $('#connMsg'); m2.className = 'msg err'; m2.textContent = r.one_away ? 'Bijna! Eén woord zit fout.' : 'Dat is geen groepje.';
  };
}
