async function drawMemory(body, view) {
  body.innerHTML = '<p class="hint">Laden…</p>';
  const { data, error } = await sb.rpc('memory_state');
  if (error) { body.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  puz.mem = { busy: false, open: data.open ? data.open.pos : null };
  body.innerHTML = `<div class="memory-wrap">
    <p class="hint">Vind de 8 paren in zo weinig mogelijk beurten. ≤10 beurten: 40 🪙 · ≤14: 30 · ≤18: 20 · meer: 10.</p>
    <div class="battle-bar"><span class="pill">Beurten: <strong id="memMoves">${data.moves}</strong></span></div>
    <div class="memory-grid">${Array.from({ length: 16 }, (_, i) => {
      const m = data.matched[i], o = data.open && data.open.pos === i ? data.open.icon : null;
      return `<button type="button" class="mem-card${m ? ' up matched' : o ? ' up' : ''}" data-mem="${i}" ${m || data.status !== 'playing' ? 'disabled' : ''}>
        <span class="mem-inner"><span class="mem-back"></span><span class="mem-front">${m || o || ''}</span></span></button>`;
    }).join('')}</div>
    <p class="msg${data.status === 'won' ? ' ok' : ''}" id="memMsg" role="status">${data.status === 'won' ? `Opgelost in ${data.moves} beurten! Je kreeg ${data.reward} 🪙.` : ''}</p>
  </div>`;
  if (data.status !== 'playing') return;
  const show = (i, icon) => { const c = body.querySelector(`[data-mem="${i}"]`); c.querySelector('.mem-front').textContent = icon; c.classList.add('up'); };
  const hide = i => { const c = body.querySelector(`[data-mem="${i}"]`); c?.classList.remove('up'); };
  body.querySelectorAll('[data-mem]').forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.mem);
    if (puz.mem.busy || b.classList.contains('up')) return;
    puz.mem.busy = true;
    const { data: r, error: e2 } = await sb.rpc('memory_flip', { p_pos: i });
    if (e2) { $('#memMsg').className = 'msg err'; $('#memMsg').textContent = e2.message; puz.mem.busy = false; return; }
    SFX.play('flip');
    show(i, r.icon);
    if (r.other === undefined) { puz.mem.open = i; puz.mem.busy = false; return; }
    $('#memMoves').textContent = r.moves;
    if (r.match) {
      SFX.play('coin');
      for (const k of [i, r.other]) { const c = body.querySelector(`[data-mem="${k}"]`); c.classList.add('matched'); c.disabled = true; }
    } else {
      await sleep(850);
      hide(i); hide(r.other);
    }
    puz.mem.open = null; puz.mem.busy = false;
    if (r.won) {
      $('#memMsg').className = 'msg ok'; $('#memMsg').textContent = `Opgelost in ${r.moves} beurten!`;
      await puzzlePrize(r.prize);
      renderPuzzles(view);
    }
  });
}

// --- Mini-sudoku 6×6 ---
async function drawSudoku(body, view) {
  clearInterval(puz.sud.timer);
  body.innerHTML = '<p class="hint">Laden…</p>';
  const { data, error } = await sb.rpc('sudoku_state');
  if (error) { body.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  const key = 'ptc-sudoku-' + todayBrussels();
  if (data.status === 'new') {
    body.innerHTML = `<div class="sudoku-wrap">
      <p class="hint">Vul het rooster zodat elke rij, elke kolom en elk blokje (2×3) de cijfers 1 tot 6 precies één keer bevat.
      Opgelost: 30 🪙, onder 3 minuten: 45 🪙. De klok start zodra je begint.</p>
      <button class="btn small" id="sudStart" type="button">Start de sudoku ⏱️</button></div>`;
    $('#sudStart').onclick = async () => { await sb.rpc('sudoku_start'); drawSudoku(body, view); };
    return;
  }
  const giv = data.givens;
  let grid;
  try { grid = JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) { grid = null; }
  if (data.status === 'won' && data.grid) grid = data.grid;
  if (!Array.isArray(grid) || grid.length !== 36) grid = [...giv];
  giv.forEach((v, i) => { if (v) grid[i] = v; });
  const done = data.status === 'won';
  const conflicts = () => {
    const bad = new Set();
    for (let i = 0; i < 36; i++) for (let j = i + 1; j < 36; j++) {
      if (!grid[i] || grid[i] !== grid[j]) continue;
      const ri = Math.floor(i / 6), ci = i % 6, rj = Math.floor(j / 6), cj = j % 6;
      if (ri === rj || ci === cj || (Math.floor(ri / 2) === Math.floor(rj / 2) && Math.floor(ci / 3) === Math.floor(cj / 3))) { bad.add(i); bad.add(j); }
    }
    return bad;
  };
  const cellHtml = (i, bad) => `<button type="button" class="sud-cell${giv[i] ? ' given' : ''}${puz.sud.cell === i ? ' sel' : ''}${bad.has(i) ? ' bad' : ''}${i % 6 === 2 ? ' br' : ''}${Math.floor(i / 6) % 2 === 1 && i < 30 ? ' bb' : ''}" data-cell="${i}" ${giv[i] || done ? 'disabled' : ''}>${grid[i] || ''}</button>`;
  const draw = () => {
    const bad = conflicts();
    $('#sudGrid').innerHTML = grid.map((_, i) => cellHtml(i, bad)).join('');
    $('#sudGrid').querySelectorAll('[data-cell]').forEach(c => c.onclick = () => { puz.sud.cell = Number(c.dataset.cell); draw(); });
    const full = grid.every(v => v);
    if ($('#sudCheck')) $('#sudCheck').disabled = !full || bad.size > 0;
  };
  body.innerHTML = `<div class="sudoku-wrap">
    <div class="battle-bar"><span class="pill">⏱️ <strong id="sudTime">${fmtSecs(data.elapsed || 0)}</strong></span></div>
    <div class="sud-grid" id="sudGrid"></div>
    ${done ? `<p class="msg ok">Opgelost in ${fmtSecs(data.elapsed)}! Je kreeg ${data.reward} 🪙.</p>` : `
      <div class="sud-pad">${[1, 2, 3, 4, 5, 6].map(n => `<button type="button" class="chip" data-num="${n}">${n}</button>`).join('')}
        <button type="button" class="chip" data-num="0" aria-label="Wissen">⌫</button></div>
      <button class="btn small" id="sudCheck" type="button" disabled>Controleer</button>`}
    <p class="msg" id="sudMsg" role="status"></p>
  </div>`;
  draw();
  if (done) return;
  const start = Date.now() - (data.elapsed || 0) * 1000;
  puz.sud.timer = setInterval(() => {
    const el = $('#sudTime'); if (!el) return clearInterval(puz.sud.timer);
    el.textContent = fmtSecs(Math.floor((Date.now() - start) / 1000));
  }, 1000);
  const put = n => {
    if (n === undefined) return draw();
    if (puz.sud.cell == null || giv[puz.sud.cell]) return;
    grid[puz.sud.cell] = n || 0;
    try { localStorage.setItem(key, JSON.stringify(grid)); } catch (_) {}
    SFX.play('tick'); draw();
  };
  body.querySelectorAll('[data-num]').forEach(b => b.onclick = () => put(Number(b.dataset.num)));
  puz.sud.put = put;
  $('#sudCheck').onclick = async () => {
    $('#sudCheck').disabled = true;
    const { data: r, error: e2 } = await sb.rpc('sudoku_submit', { p_grid: grid });
    const msg = $('#sudMsg');
    if (e2) { msg.className = 'msg err'; msg.textContent = e2.message; draw(); return; }
    if (!r.correct) { msg.className = 'msg err'; msg.textContent = 'Nog niet juist. Kijk je rijen, kolommen en blokjes na.'; draw(); return; }
    clearInterval(puz.sud.timer);
    try { localStorage.removeItem(key); } catch (_) {}
    await puzzlePrize(r.prize);
    renderPuzzles(view);
  };
}

// Toetsenbord voor de sudoku: cijfers 1-6, wissen en pijltjes (één keer geregistreerd)
document.addEventListener('keydown', e => {
  if (state.tab !== 'puzzles' || puz.tab !== 'sudoku' || !puz.sud.put || !$('#sudGrid') || !$('#sudCheck')) return;
  if (document.querySelector('dialog[open]') || e.target.closest?.('input, textarea, select')) return;
  if (/^[1-6]$/.test(e.key)) { e.preventDefault(); puz.sud.put(Number(e.key)); }
  else if (['Backspace', 'Delete', '0'].includes(e.key)) { e.preventDefault(); puz.sud.put(0); }
  else if (e.key.startsWith('Arrow') && puz.sud.cell != null) {
    e.preventDefault();
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -6, ArrowDown: 6 }[e.key];
    const n = puz.sud.cell + d;
    if (n >= 0 && n < 36) { puz.sud.cell = n; puz.sud.put(undefined); }
  }
});

// --- Klassement ---
async function drawPuzzleBoard(body) {
  body.innerHTML = '<p class="hint">Laden…</p>';
  const { data, error } = await sb.rpc('puzzle_board');
  if (error) { body.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  const me = state.session.user.id;
  const score = r => r.kind === 'conn' ? (r.status === 'won' ? `${r.score} ${r.score === 1 ? 'fout' : 'fouten'}` : '✗ niet opgelost')
    : r.kind === 'memory' ? `${r.score} beurten` : fmtSecs(r.score || 0);
  body.innerHTML = `<div class="three-col">${['conn', 'memory', 'sudoku'].map(k => {
    const rows = data.filter(r => r.kind === k);
    return `<div><h3>${PUZZLES[k].icon} ${PUZZLES[k].name}</h3>${rows.length
      ? `<ol class="board-list">${rows.map((r, i) => `<li class="board-row${r.user_id === me ? ' me' : ''}">
          <span class="board-rank">${i + 1}</span><span class="board-name">${r.user_id === me ? 'Jij' : esc(r.name)}</span>
          <span class="board-score${r.status === 'lost' ? ' lost' : ''}">${score(r)}</span></li>`).join('')}</ol>`
      : '<p class="hint">Nog niemand klaar.</p>'}</div>`;
  }).join('')}</div>`;
}

// ---------- Profiel (v13): rang, favoriete kaarten, bureau, huisdier, prestaties ----------
const BUREAU_SLOTS = { wall: '🖼️ Muur', window: '🪟 Raam', lamp: '💡 Lamp', plant: '🪴 Plant', computer: '💻 Computer', drink: '☕ Drankje', floor: '🪑 Vloer' };
const PET_STAGE = { ei: '🥚 Ei', baby: '🍼 Baby', jong: '🌱 Jong', volwassen: '⭐ Volwassen' };

function petHtml(pet, big = false) {
  if (!pet) return '';
  const face = pet.stage === 'ei' ? '🥚' : pet.emoji;
  return `<span class="pet st-${pet.stage}${pet.variant && pet.variant !== 'normaal' ? ' v-' + pet.variant : ''}${big ? ' big' : ''}" title="${esc(pet.name)}">${face}</span>`;
}

function bureauHtml(b, pet) {
  const e = slot => (b[slot] && b[slot].emoji) || '';
  return `<div class="bureau" aria-label="Bureau">
    <div class="b-wall">
      <div class="b-window">${e('window')}</div>
      <div class="b-poster">${e('wall')}</div>
    </div>
    <div class="b-desk">
      <span class="b-lamp">${e('lamp')}</span>
      <span class="b-plant">${e('plant')}</span>
      <span class="b-pc">${e('computer')}</span>
      <span class="b-drink">${e('drink')}</span>
      ${pet ? `<span class="b-pet">${petHtml(pet)}</span>` : ''}
    </div>
    <span class="b-floor">${e('floor')}</span>
  </div>`;
}

// Kopje van een profiel (eigen of van een vriend)
function profileHeadHtml(p) {
  const av = p.avatar_url ? ` style="background-image:url('${esc(p.avatar_url)}')"` : '';
  return `<div class="prof-head">
    <span class="prof-av${ringCls(p.ring)}"${av}>${p.avatar_url ? '' : esc((p.name || '?').charAt(0).toUpperCase())}</span>
    <div><h2>${esc(p.name)} ${titleChip(p.title)}</h2>
      <div class="battle-bar">${rankChip(p.season?.rank, p.season?.points)}
        <span class="pill">🎴 ${p.cards} kaarten</span><span class="pill">🏷️ ${p.stickers.have}/${p.stickers.total}</span>
        <span class="pill">🏅 ${p.achievements.length} prestaties</span></div></div>
  </div>
  ${p.achievements.length ? `<div class="badge-row">${p.achievements.map(a => `<span class="ach-badge" title="${esc(a.title)}">${a.icon}</span>`).join('')}</div>` : ''}`;
}

// Favoriete kaarten: enkel tonen als de kijker de kaart zelf ook heeft (anders blijft ze geheim)
function showcaseHtml(p, own) {
  const slots = [0, 1, 2].map(i => {
    const s = p.showcase[i];
    if (!s) return `<div class="show-slot empty">${own ? 'Kies een kaart' : ''}</div>`;
    const c = cardById(s.id);
    if (!c) return '<div class="show-slot empty"></div>';
    const visible = own || state.owned.get(c.id) || state.isAdmin;
    return `<div class="show-slot">${visible ? renderCard(c, { level: s.level }) : renderCard(c, { locked: true })}</div>`;
  });
  return `<div class="showcase">${slots.join('')}</div>`;
}

async function renderProfile(view) {
  view.innerHTML = '<section class="col" style="max-width:none"><p class="hint">Laden…</p></section>';
  const [prof, ach, bureau] = await Promise.all([sb.rpc('profile_view', { p_user: null }), sb.rpc('achievements_state'), sb.rpc('bureau_state')]);
  if (state.tab !== 'profile') return;
  if (prof.error) { view.innerHTML = `<section class="col">${pageHead('Profiel', 'profile')}${notReady}</section>`; return; }
  const p = prof.data, pet = p.pet;
  const achs = (ach.data || []).sort((a, b) => (a.claimed - b.claimed) || ((b.progress >= b.target) - (a.progress >= a.target)));
  const ready = achs.filter(a => !a.claimed && a.progress >= a.target).length;
  view.innerHTML = `<section class="col" style="max-width:none">
    <div class="battle-top">${pageHead('Profiel', 'profile')}</div>
    <div class="two-col">
      <div>
        <div class="prof-card">${profileHeadHtml(p)}</div>
        <div class="battle-bar" style="margin-top:16px"><h3 style="margin:0">⭐ Favoriete kaarten</h3><button class="link" id="editShowcase" type="button">Kiezen</button></div>
        ${showcaseHtml(p, true)}
        <h3 style="margin-top:18px">🐾 Huisdier</h3>
        <div class="pet-panel" id="petPanel"></div>
      </div>
      <div>
        <div class="battle-bar"><h3 style="margin:0">🪑 Bureau</h3><button class="link" id="editBureau" type="button">✏️ Inrichten</button></div>
        ${bureauHtml(p.bureau, pet)}
        <div id="bureauEditor" hidden></div>
        <div class="battle-bar" style="margin-top:18px"><h3 style="margin:0">🏅 Prestaties</h3>${ready ? `<span class="pill pill-turn">${ready} klaar om op te halen</span>` : ''}</div>
        <ul class="quest-list ach-list">${achs.map(a => {
          const ok = a.progress >= a.target;
          return `<li class="quest${a.claimed ? ' done' : ok ? ' ready' : ''}">
            <span class="ach-icon">${a.icon}</span>
            <div class="quest-main"><strong>${esc(a.title)}</strong><small>${esc(a.desc)}</small>
              <div class="qbar"><span style="width:${Math.round(a.progress / a.target * 100)}%"></span></div>
              <small>${a.progress}/${a.target}</small></div>
            ${a.claimed ? '<span class="pill">✓</span>' : ok ? `<button class="btn small" data-ach="${esc(a.key)}" type="button">+${a.reward} 🪙</button>` : `<span class="quest-reward">${a.reward} 🪙</span>`}
          </li>`;
        }).join('')}</ul>
      </div>
    </div>
  </section>`;

  // Huisdier
  const petPanel = $('#petPanel');
  if (!pet) {
    petPanel.innerHTML = `<p class="hint">Adopteer een gratis kantoorhuisdier. Het begint als een ei en groeit als je elke dag speelt. Welk dier eruit komt, is een verrassing!</p>
      <div class="battle-bar"><input id="petName" class="tselect" maxlength="20" placeholder="Naam" style="width:auto;min-width:160px">
      <button class="btn small" id="adoptPet" type="button">🥚 Adopteren</button></div>`;
    $('#adoptPet').onclick = async () => {
      const { error } = await sb.rpc('adopt_pet', { p_name: $('#petName').value || 'Naamloos' });
      if (error) return alert(error.message);
      SFX.play('heal'); renderProfile(view);
    };
  } else {
    const pct = pet.next ? Math.round(pet.xp / pet.next * 100) : 100;
    petPanel.innerHTML = `<div class="pet-show">${petHtml(pet, true)}
      <div><strong class="pet-name">${esc(pet.name)}</strong> <button class="link" id="renamePet" type="button">✏️</button><br>
        <span class="pill">${PET_STAGE[pet.stage]}</span>${pet.label ? ` <span class="pill">${esc(pet.label)}${pet.variant !== 'normaal' ? ` · ${pet.variant === 'goud' ? '✨ goud' : '🌈 regenboog'}` : ''}</span>` : ''}
        <div class="qbar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
        <small class="hint">${pet.next ? `${pet.xp}/${pet.next} XP tot ${pet.stage === 'ei' ? 'het ei uitkomt' : 'de volgende fase'}` : `${pet.xp} XP · volgroeid!`}</small></div></div>
      <p class="hint" style="margin-top:8px">Elke dag max 3 XP: 1 voor een Wordle, 1 voor een battle en 1 voor een opgeloste puzzel.</p>`;
    $('#renamePet').onclick = async () => {
      const n = prompt('Nieuwe naam voor je huisdier:', pet.name);
      if (!n) return;
      const { error } = await sb.rpc('rename_pet', { p_name: n });
      if (error) return alert(error.message);
      renderProfile(view);
    };
  }

  // Prestaties ophalen
  view.querySelectorAll('[data-ach]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data, error } = await sb.rpc('claim_achievement', { p_key: b.dataset.ach });
    if (error) { alert(error.message); b.disabled = false; return; }
    setWallet(data.wallet);
    toast(`🏅 Prestatie behaald! +${data.reward} 🪙`);
    await showStickers([data.sticker], 'Prestatiebeloning');
    renderProfile(view);
  });

  // Favoriete kaarten kiezen
  $('#editShowcase').onclick = () => {
    const dlg = $('#friendModal');
    const pick = new Set(p.showcase.map(s => s.id));
    const owned = state.cards.filter(c => state.owned.get(c.id)).sort((a, b) => (RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]) || a.id - b.id);
    dlg.innerHTML = `<div class="accbox statbox"><h2>Kies max. 3 favorieten</h2>
      <div class="battle-pick wrap">${owned.map(c => `<button class="pick${pick.has(c.id) ? ' selected' : ''}" type="button" data-fav="${c.id}">${renderCard(c, mineOpts(c))}</button>`).join('')}</div>
      <div class="battle-bar"><button class="btn small" id="saveFav" type="button">Opslaan</button><button class="link" id="favClose" type="button">Annuleren</button></div></div>`;
    dlg.showModal();
    dlg.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => {
      const id = Number(b.dataset.fav);
      if (pick.has(id)) pick.delete(id); else if (pick.size < 3) pick.add(id);
      b.classList.toggle('selected', pick.has(id));
    });
    $('#favClose').onclick = () => dlg.close();
    $('#saveFav').onclick = async () => {
      const { error } = await sb.rpc('set_showcase', { p_cards: [...pick] });
      if (error) return alert(error.message);
      dlg.close(); renderProfile(view);
    };
  };

  // Bureau inrichten
  $('#editBureau').onclick = () => {
    const ed = $('#bureauEditor');
    ed.hidden = !ed.hidden;
    if (ed.hidden || bureau.error) { if (bureau.error) ed.innerHTML = notReady; return; }
    const items = bureau.data.items;
    const cur = slot => p.bureau[slot]?.key;
    ed.innerHTML = `<div class="bureau-editor">${Object.entries(BUREAU_SLOTS).map(([slot, label]) => `<div class="cos-group"><h4>${label}</h4>
      <div class="cos-list">${items.filter(i => i.slot === slot).map(i => {
        const on = cur(slot) === i.key;
        const action = on ? '<span class="pill">✓ in gebruik</span>'
          : i.owned ? `<button class="btn small" data-equip-b="${esc(i.key)}" type="button">Gebruiken</button>`
          : i.price == null ? '<small class="hint" style="margin:0">Vervolledig het stickerthema</small>'
          : `<button class="btn small" data-buy-b="${esc(i.key)}" data-price="${i.price}" type="button" ${state.wallet < i.price ? 'disabled' : ''}>${i.price} 🪙</button>`;
        return `<div class="cos-item${on ? ' on' : ''}"><span class="cos-prev b-prev">${i.emoji || '∅'}</span><span class="cos-name">${esc(i.name)}</span>${action}</div>`;
      }).join('')}</div></div>`).join('')}</div>`;
    ed.querySelectorAll('[data-buy-b]').forEach(b => b.onclick = async () => {
      if (!confirm(`Kopen voor ${b.dataset.price} polycoins?`)) return;
      b.disabled = true;
      const { data, error } = await sb.rpc('buy_bureau_item', { p_key: b.dataset.buyB });
      if (error) { alert(error.message); b.disabled = false; return; }
      setWallet(data.wallet); SFX.play('coin'); renderProfile(view).then(() => $('#editBureau')?.click());
    });
    ed.querySelectorAll('[data-equip-b]').forEach(b => b.onclick = async () => {
      const { error } = await sb.rpc('equip_bureau_item', { p_key: b.dataset.equipB });
      if (error) return alert(error.message);
      renderProfile(view).then(() => $('#editBureau')?.click());
    });
  };
}

// ---------- Melding bij een nieuwe versie van de site ----------
// Vergelijkt de CSS + code van deze pagina met de versie op de server. Geen versienummer nodig:
// elke wijziging aan index.html wordt vanzelf opgemerkt.
function siteFingerprint(doc) {
  const style = doc.querySelector('style')?.textContent || '';
  const scripts = [...doc.querySelectorAll('script:not([src])')];
  const code = scripts.length ? scripts[scripts.length - 1].textContent : '';
  let h = 5381;
  const txt = style + '\u0000' + code;
  for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
  return h;
}
const CURRENT_FINGERPRINT = siteFingerprint(document);
let updateShown = false, updateAvailable = false, lastUpdateCheck = 0;

// Vernieuwknop: haalt de nieuwste versie van de site (en de woordenlijst) op en herlaadt
async function hardReload(btn) {
  if (btn) { btn.disabled = true; btn.classList.add('spin'); }
  try { await Promise.all([fetch(location.pathname, { cache: 'reload' }), fetch('words.txt', { cache: 'reload' })]); } catch (_) {}
  location.reload();
}

async function checkForUpdate() {
  if (updateShown || Date.now() - lastUpdateCheck < 60000) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    if (siteFingerprint(doc) !== CURRENT_FINGERPRINT) {
      updateAvailable = true;
      $('#refreshBtn')?.classList.add('has-update');
      showUpdateBanner();
    }
  } catch (_) { /* offline of geblokkeerd: later opnieuw proberen */ }
}

function showUpdateBanner() {
  updateShown = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = `<span>✨ Er is een nieuwe versie van de site.</span>
    <button class="btn small" type="button" id="updateNow">Vernieuwen</button>
    <button class="link" type="button" id="updateLater" aria-label="Later">Later</button>`;
  document.body.appendChild(bar);
  $('#updateNow').onclick = () => hardReload($('#updateNow'));
  $('#updateLater').onclick = () => { bar.remove(); setTimeout(() => { updateShown = false; }, 15 * 60000); };
}

setInterval(checkForUpdate, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
addEventListener('focus', checkForUpdate);

initBackground();
init();
</script>
