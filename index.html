<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLYGON Trading Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171C; --bg2:#1D2229; --panel:#232932; --sleeve:#F4EFE4; --page:#FBF7EE;
  --ink:#F1EFE9; --ink-soft:#B9C2CC; --muted:#8892A0; --line:#3A4453;
  /* Wordle-palet: groen (correct), geel (bijna), zwart (basis) + grijs/wit als subtiele basiskleuren */
  --green:#5DA352; --green-soft:#7FC26F; --yellow:#C9B458; --yellow-soft:#DFCB7C;
  --wblack:#15181D; --grey:#8B93A0; --grey-soft:#AEB6C0; --white:#F3F1E9;
  --amber:var(--green); --amber-soft:var(--green-soft);
  --gold:#C99A1E; --cat:#2FA79E;
  --r:20px; --r-sm:12px;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;
  background:
    radial-gradient(ellipse 80% 60% at 15% 0%,rgba(93,163,82,.28),transparent 60%),
    radial-gradient(ellipse 70% 60% at 100% 100%,rgba(201,180,88,.22),transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%,rgba(139,92,246,.14),transparent 60%),
    linear-gradient(160deg,#131a17,#12151b 55%,#17141c);
  background-attachment:fixed;
  position:relative;
}
/* Speelse achtergrond: zwevende Wordle-tegels en veelhoeken (zie initBackground) */
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0 0 10px;color:#fff}
h1{font-size:clamp(30px,5vw,48px)}
h2{font-size:clamp(22px,2.6vw,30px)}
h3{font-size:19px}
button,input,textarea{font:inherit}
a{color:var(--amber-soft)}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 56px}
.wrap.wide{max-width:min(1400px,96vw);padding:14px 22px 28px}
.col{max-width:720px}
.hint{color:var(--ink-soft);margin:0 0 16px;max-width:72ch}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Knoppen en formulieren */
.btn{background:var(--amber);color:#12160f;border:0;border-radius:14px;padding:14px 22px;font:800 16.5px var(--body);min-height:50px;cursor:pointer;width:100%;box-shadow:0 5px 0 #3b7334,0 8px 18px -6px rgba(0,0,0,.5);transition:transform .1s ease,box-shadow .1s ease,background .15s ease}
.btn:hover:not(:disabled){background:var(--amber-soft);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #3b7334,0 3px 8px -4px rgba(0,0,0,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:10px 6px;font-size:16px}
.link:hover{color:var(--amber-soft)}
.form{display:grid;gap:18px;margin:24px 0 8px}
.form label{display:grid;gap:7px;font-weight:600;font-size:16px;color:var(--ink-soft)}
.form input,.form textarea{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm);padding:14px;min-height:54px;font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.5;resize:vertical}
.form input{font-family:var(--body)}
.form input:focus,.form textarea:focus{background:#2C3541}
.msg{margin:0;min-height:1.5em;font-size:16px}
.msg.err,.err{color:#F0897E}
.msg.ok{color:var(--green-soft)}

/* Wordle-tegels */
.tile{width:clamp(50px,15vw,70px);aspect-ratio:1;display:grid;place-items:center;border-radius:var(--r-sm);color:#fff;font:800 clamp(26px,8vw,38px)/1 var(--display)}
.t-g{background:var(--green)} .t-y{background:var(--yellow)} .t-x{background:var(--grey)}
.tilerow,.hero{display:flex;gap:6px;justify-content:center}
.hero{margin:20px 0 24px;justify-content:flex-start}

/* Kopregel en tabs */
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 16px;gap:12px}
.brand{font:800 24px var(--display);color:#fff;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand em{font-style:normal;color:var(--amber-soft)}
@media (max-width:640px){.brand{font-size:19px;flex-direction:column;gap:0;line-height:1.05}}
.topright{display:flex;gap:10px;align-items:center}
.coinpill{display:flex;align-items:center;gap:6px;background:rgba(21,24,29,.8);border:1px solid var(--line);color:var(--yellow-soft);font:800 15px var(--body);padding:9px 14px;border-radius:999px;white-space:nowrap}
.avbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background-color:var(--panel);background-size:cover;background-position:center;color:#fff;font:700 17px var(--body);cursor:pointer;display:grid;place-items:center;padding:0;flex-shrink:0;transition:border-color .15s ease,transform .15s ease}
.avbtn:hover{border-color:var(--green-soft);transform:translateY(-1px)}
.menu{position:relative}
.menu-btn{display:flex;align-items:center;gap:8px;background:var(--yellow);color:#15181D;border:0;border-radius:14px;padding:10px 14px;font:800 15px var(--body);cursor:pointer;
  box-shadow:0 4px 0 #8f7f35,0 8px 18px -6px rgba(0,0,0,.5);transition:transform .1s ease,box-shadow .1s ease}
.menu-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f7f35}
.menu-btn .chev{font-size:12px;transition:transform .2s ease}
.menu-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu-ico{font-size:17px;line-height:1}
.menu-list{position:absolute;right:0;top:calc(100% + 10px);z-index:50;min-width:210px;padding:8px;display:grid;gap:2px;
  background:rgba(29,34,41,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -10px rgba(0,0,0,.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:menu-in .16s ease both;transform-origin:top right}
@keyframes menu-in{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
.menu-list button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:11px 12px;color:var(--ink);font:700 15.5px var(--body);cursor:pointer;text-align:left}
.menu-list button:hover{background:rgba(255,255,255,.07)}
.menu-list button[aria-current="page"]{background:rgba(201,180,88,.2);color:var(--yellow-soft)}
.menu-list .tab-badge{margin-left:auto}
@media (max-width:640px){
  .wrap.wide{padding:12px 14px 24px}
  .brand{font-size:16px}
  .topright{gap:7px}
  .menu-btn .menu-label{display:none}
  .menu-btn{padding:9px 11px;gap:6px}
  .coinpill{padding:7px 10px;font-size:14px}
  .avbtn{width:38px;height:38px;font-size:15px}
}

/* Paginatitel met info-icoontje */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.page-head h2{margin:0}
.info-btn{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:2px solid var(--yellow-soft);background:rgba(201,180,88,.12);color:var(--yellow-soft);
  font:800 15px/1 Georgia,serif;font-style:italic;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s ease,background .15s ease}
.info-btn:hover{transform:scale(1.1) rotate(-6deg);background:rgba(201,180,88,.25)}
.infobox{width:min(520px,92vw);max-height:88vh;overflow-y:auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);animation:zoom-in .18s ease both;color:var(--ink)}
.infobox h2{display:flex;align-items:center;gap:10px}
.infobox p,.infobox li{color:var(--ink-soft)}
.infobox ul{padding-left:20px;margin:8px 0 12px}
.infobox .link{padding-left:0}

/* Eigen Wordle: rondes, speelbord en toetsenbord */
.round-tabs{display:flex;gap:8px;margin-bottom:14px;max-width:520px}
.round-tab{flex:1;display:grid;gap:1px;text-align:left;background:rgba(35,41,50,.88);border:2px solid var(--line);border-radius:14px;padding:8px 14px;color:var(--ink);font:800 15px var(--body);cursor:pointer;transition:border-color .15s,background .15s}
.round-tab small{font:600 12.5px var(--body);color:var(--ink-soft)}
.round-tab.active{border-color:var(--yellow);background:rgba(201,180,88,.16)}
.round-tab.done small{color:var(--green-soft)}
.wboard{--rows:6;display:grid;gap:6px;width:min(300px,100%,calc((100vh - 430px) * 5 / var(--rows)));min-width:200px;margin:0 auto 8px}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrow.shake{animation:shake .4s ease}
.wtile{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;background:rgba(21,24,29,.65);
  color:#fff;font:800 clamp(20px,5.5vw,28px)/1 var(--display);text-transform:uppercase;user-select:none}
.wtile.filled{border-color:var(--grey-soft);animation:tile-pop .12s ease}
.wtile.g{background:var(--green);border-color:var(--green)}
.wtile.y{background:var(--yellow);border-color:var(--yellow)}
.wtile.x{background:#3a414c;border-color:#3a414c}
.wtile.flip{animation:wflip .5s ease-in-out both;animation-delay:calc(var(--i) * .22s)}
@keyframes wflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes tile-pop{50%{transform:scale(1.1)}}
.wmsg{text-align:center;min-height:1.4em;margin:0 auto 8px;max-width:420px}
.wkeys{display:grid;gap:6px;width:min(500px,100%);margin:0 auto}
.wkrow{display:flex;gap:5px;justify-content:center}
.wkey{flex:1;max-width:44px;height:clamp(40px,6.2vh,52px);border:0;border-radius:8px;background:#5a616d;color:#fff;font:800 15px var(--body);cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0;touch-action:manipulation;transition:transform .08s}
.wkey:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.wkey.wide{flex:1.6;max-width:70px;font-size:13px}
.wkey.g{background:var(--green)} .wkey.y{background:var(--yellow);color:#15181D} .wkey.x{background:#2b3038;color:#7d8591}
.round-closed{text-align:center;padding:36px 10px;background:rgba(35,41,50,.7);border:1px solid var(--line);border-radius:var(--r);max-width:520px}
.big-lock{font-size:52px;line-height:1;margin-bottom:10px}
.countdown{font:800 30px var(--display);color:var(--yellow-soft);margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.wtile.flip,.wtile.filled{animation:none}}

/* Shop */
.shop-balance{font-size:17px;padding:10px 18px}
.shop-packs{display:grid;gap:12px}
.shop-pack{display:flex;gap:16px;align-items:center;background:rgba(35,41,50,.88);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 16px}
.pack.mini{width:78px;flex-shrink:0;animation:none;cursor:default;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.shop-pack-info{display:grid;gap:6px;justify-items:start}
.shop-pack-info small{color:var(--ink-soft)}
.shop-list{max-height:calc(100vh - 260px);overflow-y:auto;padding-right:6px}
.shop-list .battle-row{padding:6px 0}
.shop-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;max-height:calc(100vh - 250px);overflow-y:auto;padding:4px 6px 4px 2px}
.shop-card{display:grid;gap:6px}
.shop-card .btn{width:100%}
@media (max-width:560px){.shop-cards{grid-template-columns:repeat(2,1fr);max-height:none}}
.whelp{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;margin-top:8px}
.whelp .link{font-size:14px;padding:4px 2px}
.whelp .link:disabled{opacity:.4;cursor:default}
.hint-chip{background:rgba(201,180,88,.18);border:1px solid var(--yellow);color:var(--yellow-soft);border-radius:999px;padding:3px 10px;font:700 13px var(--body)}

/* Melding nieuwe versie */
.update-bar{position:fixed;left:0;right:0;margin:0 auto;bottom:18px;z-index:1000;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 24px);padding:12px 16px;background:rgba(29,34,41,.97);border:1px solid var(--yellow);border-radius:16px;
  box-shadow:0 14px 34px -8px rgba(0,0,0,.7);color:var(--ink);font-weight:600;animation:menu-in .25s ease both}
.update-bar .btn{width:auto}
/* Vernieuwknop in de kopregel (licht op als er een nieuwe versie is) */
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:rgba(21,24,29,.8);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0;flex-shrink:0;transition:border-color .15s,transform .15s}
.iconbtn:hover{border-color:var(--green-soft);transform:translateY(-1px)}
.iconbtn.spin span{display:inline-block;animation:spin .8s linear infinite}
.iconbtn.has-update{border-color:var(--yellow);box-shadow:0 0 0 0 rgba(232,195,76,.7);animation:pulse-ring 1.8s ease-out infinite}
.iconbtn.has-update::after{content:"";position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#E0584B;border:2px solid var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(232,195,76,.6)}100%{box-shadow:0 0 0 12px rgba(232,195,76,0)}}
@media (max-width:640px){.iconbtn{width:38px;height:38px;font-size:15px}}

/* Meldingen rechtsboven (beloningen, opwaarderingen) */
.toasts{position:fixed;top:14px;left:0;right:0;z-index:1001;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:min(460px,100%);padding:12px 18px;background:rgba(29,34,41,.97);border:1px solid var(--yellow);border-radius:16px;box-shadow:0 14px 34px -8px rgba(0,0,0,.7);color:var(--ink);font-weight:600;animation:menu-in .25s ease both;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(-8px)}

/* Today: hub naast de Wordle (kaart, opdrachten, nieuws, klassement) */
.hub{display:grid;gap:14px;align-content:start;min-width:0}
.hub-tabs{flex-wrap:wrap;justify-self:start;border-radius:16px}
.hub-tabs button{position:relative;font-size:14px;padding:7px 12px}
.hub-tabs .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#E0584B}
.hub-body{background:rgba(35,41,50,.82);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-height:220px}
.hub-body .stage{min-height:0}
.hub-body h4{margin:14px 0 6px;font:800 15px var(--body);color:var(--yellow-soft)}
.hub-body h4:first-child{margin-top:0}
.hub-body .hint{margin-bottom:10px;font-size:14.5px}
.zoomable{background:none;border:0;padding:0;cursor:zoom-in;display:block;width:min(340px,80vw,calc((100vh - 300px) * .714));color:inherit}
.quest-list,.news-list,.board-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(21,24,29,.55)}
.quest.done{opacity:.6}
.quest.ready{border-color:var(--green);background:rgba(93,163,82,.14)}
.quest-main{flex:1;min-width:0;display:grid;gap:5px}
.quest-main strong{font-size:15px}
.quest-main small{color:var(--muted);font-weight:600}
.qbar{height:8px;border-radius:999px;background:var(--wblack);overflow:hidden}
.qbar span{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s ease}
.quest-reward{font:800 14px var(--body);color:var(--yellow-soft);white-space:nowrap}
.news-item{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:0}
.news-ico{font-size:20px;line-height:1.2}
.news-item p{margin:0;font-size:15px}
.news-item small{color:var(--muted)}
.board-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:rgba(21,24,29,.5)}
.board-row.me{outline:2px solid var(--green);color:var(--green-soft)}
.board-rank{width:22px;font-weight:800;color:var(--muted)}
.board-name{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-score{font:800 15px var(--body);font-variant-numeric:tabular-nums}
.board-score.lost{color:#F0897E}
.share-row{display:flex;justify-content:center;margin-top:6px}

/* Kaartlevels (opwaarderen met dubbels) */
.lvl-badge{position:absolute;left:-6px;top:-8px;z-index:3;background:linear-gradient(135deg,#F5D97A,#C99A1E);color:#2a1d00;border-radius:var(--r-sm);padding:2px 8px;font:800 12px var(--body);letter-spacing:-.05em;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.card .glitter{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,rgba(255,255,255,.85) 0 1px,transparent 2px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.9) 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 60%,rgba(255,255,255,.8) 0 1px,transparent 2px),linear-gradient(115deg,transparent 35%,rgba(255,240,180,.45) 48%,transparent 60%);
  background-size:100% 100%,100% 100%,100% 100%,100% 100%,250% 250%;animation:glitter 3.5s linear infinite}
@keyframes glitter{0%{background-position:0 0,0 0,0 0,0 0,120% 0;opacity:.75}50%{opacity:1}100%{background-position:0 0,0 0,0 0,0 0,-120% 0;opacity:.75}}
.lvl-up{display:grid;gap:8px;justify-items:center;text-align:center;max-width:340px}
.lvl-up p{margin:0;color:var(--ink-soft);font-size:14.5px}

/* Cosmetica: kaartranden, profielringen en titels */
.cw[class*="frame-"]::before{content:"";position:absolute;inset:-2.4cqw;border-radius:8.5cqw;z-index:0}
.cw[class*="frame-"] .card{z-index:1}
.cw.frame-gold::before{background:linear-gradient(135deg,#FFF1BE,#D9A61C 30%,#FFF6D6 50%,#B8860B 75%,#F5D97A)}
.cw.frame-neon::before{background:linear-gradient(90deg,#2FE0D0,#E040FB,#2FE0D0);background-size:200% 100%;box-shadow:0 0 14px #2FE0D0,0 0 22px #E040FB;animation:frame-move 3s linear infinite}
.cw.frame-holo::before{background:conic-gradient(from var(--fa,0deg),#ff6b6b,#ffd93d,#6bff95,#4dd0ff,#b06bff,#ff6b6b);animation:frame-spin 4s linear infinite;filter:saturate(.9) brightness(1.05)}
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes frame-spin{to{--fa:360deg}}
@keyframes frame-move{to{background-position:200% 0}}
.ring-green{border-color:#5DA352 !important;box-shadow:0 0 0 2px #5DA352,0 0 10px rgba(93,163,82,.7)}
.ring-gold{border-color:#E8C34C !important;box-shadow:0 0 0 2px #E8C34C,0 0 12px rgba(232,195,76,.75)}
.ring-rainbow{border-color:transparent !important;box-shadow:0 0 0 3px #ff6b6b,0 0 0 5px #ffd93d,0 0 0 7px #4dd0ff,0 0 14px rgba(176,107,255,.8)}
.title-chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:rgba(201,180,88,.18);border:1px solid var(--yellow);color:var(--yellow-soft);font:700 11.5px var(--body);vertical-align:middle;white-space:nowrap}
.cos-group{margin-bottom:14px}
.cos-group h4{margin:0 0 2px}
.cos-group > small{display:block;margin-bottom:8px}
.cos-list{display:grid;gap:8px}
.cos-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(21,24,29,.55)}
.cos-item.on{border-color:var(--green)}
.cos-name{flex:1;font-weight:700}
.cos-prev{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--bg2);border:2px solid var(--line)}
.frame-prev{border-radius:8px;width:28px;height:38px;border:4px solid}
.frame-prev.frame-gold{border-color:#D9A61C;background:#FFF6D6}
.frame-prev.frame-neon{border-color:#2FE0D0;box-shadow:0 0 8px #E040FB;background:#1b1f26}
.frame-prev.frame-holo{border-image:conic-gradient(#ff6b6b,#ffd93d,#6bff95,#4dd0ff,#b06bff,#ff6b6b) 1;background:#1b1f26}
.index-list .badge{margin:0 auto 0 6px}

/* Ideeënbus */
.ideas-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
@media (max-width:899px){.ideas-grid{grid-template-columns:1fr}}
.seg{display:flex;background:rgba(21,24,29,.8);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink-soft);font:700 13px var(--body);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--yellow);color:#15181D}
.idea-list{display:grid;gap:8px;max-height:calc(100vh - 230px);overflow-y:auto;padding-right:6px}
@media (max-width:899px){.idea-list{max-height:none}}
.idea{display:flex;gap:12px;align-items:flex-start;background:rgba(35,41,50,.88);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}
.idea.status-done,.idea.status-rejected{opacity:.65}
.vote{display:grid;justify-items:center;min-width:46px;padding:6px 4px;border:2px solid var(--line);border-radius:12px;background:rgba(21,24,29,.7);color:var(--ink-soft);cursor:pointer;font:800 15px var(--body);transition:transform .1s,border-color .15s}
.vote:active{transform:scale(.94)}
.vote .vote-arrow{font-size:12px;line-height:1}
.vote.on{border-color:var(--green);background:rgba(93,163,82,.2);color:var(--green-soft)}
.idea-main{flex:1;min-width:0}
.idea-body{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.idea-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;color:var(--muted);font-size:13px}
.idea-status{font-weight:700;color:var(--ink-soft)}
.idea-set{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font:600 12.5px var(--body)}
.idea-meta .link{font-size:13px;padding:0}

/* Vandaag-tab: kaartopening naast het formulier op brede schermen */
.today-grid{display:grid;gap:32px;align-items:start}
.today-grid .col{max-width:none}
@media (min-width:860px){
  .today-grid{grid-template-columns:1fr 1.15fr}
}

/* Upload / stage */
.stage{position:relative;display:grid;justify-items:center;gap:14px;margin-top:0;min-height:320px;align-content:start}
.stage .cw{width:min(360px,86vw,calc((100vh - 230px) * .714))}
.stage-placeholder{color:var(--muted);text-align:center;padding:64px 24px;border:1.5px dashed var(--line);border-radius:18px;width:100%;font-size:16px}
.result{margin:0;text-align:center;font-weight:600;color:var(--ink-soft);max-width:56ch;font-size:1.15em}
.odds{margin:4px 0 22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px}
.odds summary{cursor:pointer;font-weight:700;color:var(--ink-soft);list-style:none}
.odds summary::-webkit-details-marker{display:none}
.odds summary::before{content:'▸ ';color:var(--yellow-soft)}
.odds[open] summary::before{content:'▾ '}
.odds-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
.odds-table th,.odds-table td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.odds-table th{color:var(--yellow-soft);font-weight:700}
.odds-table td{color:var(--ink-soft)}
.odds-table tr:last-child td{border-bottom:0;font-style:italic}

/* Pakje openen: foliezakje, scheuren, kaart schuift eruit en draait om */
.pack-stage{display:grid;justify-items:center;gap:14px;width:100%;padding-top:115px}
.pack{position:relative;width:min(250px,62vw);aspect-ratio:5/7.4;background:none;border:0;padding:0;cursor:pointer;container-type:inline-size;
  animation:pack-idle 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55))}
.pack-body{position:absolute;inset:8% 0 0 0;z-index:2;border-radius:4px 4px 12px 12px;overflow:hidden;
  background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.28),transparent 42%),
             linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 45%,transparent 58%),
             repeating-linear-gradient(60deg,rgba(255,255,255,.07) 0 2px,transparent 2px 22px),
             conic-gradient(from 210deg at 50% 46%,#2f6b3a,#c9a93a,#1d4a2a,#e0cc72,#244f2e,#2f6b3a);
  background-size:auto,260% 260%,auto,auto;
  display:grid;place-items:center;
  animation:foil 3.2s linear infinite;transition:transform .5s ease-in,opacity .5s ease-in}
.pack-label{display:grid;justify-items:center;gap:2cqw;padding:6cqw 8cqw;background:rgba(10,14,11,.72);border:1.2cqw solid #d9c46a;
  border-radius:5cqw;color:#F4EFE4;text-align:center}
.pack-logo{font:800 15cqw/1 var(--display);letter-spacing:.02em;color:#E8C34C}
.pack-sub{font:700 5.2cqw/1 var(--body);letter-spacing:.18em}
.pack-count{margin-top:2cqw;font:700 5cqw/1 var(--body);color:#b9e0ae;text-transform:uppercase;letter-spacing:.12em}
.pack-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6%;
  background:repeating-linear-gradient(90deg,#d9c46a 0 4px,#9c8631 4px 8px)}
.pack-top{position:absolute;left:0;right:0;top:0;height:9%;z-index:3;border-radius:12px 12px 2px 2px;
  background:repeating-linear-gradient(90deg,#d9c46a 0 4px,#9c8631 4px 8px);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transform-origin:10% 100%}
.pack-top::after{content:"";position:absolute;left:4%;right:4%;bottom:-3px;border-bottom:2px dashed rgba(255,255,255,.55)}
.pack-card{position:absolute;left:8%;right:8%;top:14%;z-index:1;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.stage .pack-card .cw,.stage .pack-slot .cw{width:100%}
.pack-hint{margin:0;color:var(--ink-soft);font-weight:600;text-align:center}
.pack.opening{animation:pack-shake .55s ease}
.pack.opening.r-epic{filter:drop-shadow(0 0 26px #8B5CF6)}
.pack.opening.r-legendary{filter:drop-shadow(0 0 34px #E8C34C)}
.pack.torn .pack-top{animation:tear .6s ease-out forwards}
.pack.torn .pack-card{transform:translateY(-50%)}
.pack.done .pack-body{transform:translateY(45%);opacity:0}
.pack.done .pack-card{transition:opacity .35s;opacity:0}
@keyframes pack-idle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-6px)}}
@keyframes foil{0%{background-position:0 0,0 0,0 0,0 0}100%{background-position:0 0,100% 100%,0 0,0 0}}
@keyframes pack-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.03)}40%{transform:rotate(5deg) scale(1.05)}60%{transform:rotate(-4deg) scale(1.05)}80%{transform:rotate(3deg) scale(1.03)}}
@keyframes tear{0%{transform:none}35%{transform:rotate(-4deg)}100%{transform:translate(60%,-180%) rotate(35deg);opacity:0}}
.pack-results{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%}
.pack-slot{position:relative;width:min(300px,78vw)}
.pack-results.multi .pack-slot{width:min(210px,29vw)}
.pack-slot .flipper{position:relative;z-index:1;transition:transform .22s ease-in}
.pack-slot .flipper.turning{transform:rotateY(90deg) scale(.96)}
.pack-slot .flipper.turning-back{transition:transform .22s ease-out}
.glow{position:absolute;inset:-30%;pointer-events:none;border-radius:50%;filter:blur(30px);opacity:0;animation:glow-in .7s ease-out .9s both}
@keyframes glow-in{from{opacity:0;transform:scale(.6)}to{opacity:.55;transform:scale(1)}}
.glow.common{background:radial-gradient(circle,var(--grey),transparent 70%)}
.glow.epic{background:radial-gradient(circle,#8B5CF6,transparent 70%)}
.glow.legendary{background:radial-gradient(circle,var(--gold),transparent 70%)}
.glow.cat{background:radial-gradient(circle,var(--cat),transparent 70%)}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--pc,#fff);opacity:0;animation:spark-fly 1.1s ease-out forwards;animation-delay:var(--pd,0s)}
@keyframes spark-fly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.2)}
}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{position:absolute;top:-8%;left:var(--l);width:8px;height:14px;background:var(--cc);animation:confetti-fall 1.9s var(--cd,0s) ease-in forwards}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(340px) rotate(560deg);opacity:0}
}
.shake{animation:shake .4s ease}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-5px)}
  40%,60%{transform:translateX(5px)}
}
.cardflip{animation:card-flip .85s cubic-bezier(.2,1.35,.35,1) both}
@keyframes card-flip{
  0%{transform:perspective(900px) rotateY(180deg) scale(.35);opacity:0}
  60%{transform:perspective(900px) rotateY(-14deg) scale(1.07);opacity:1}
  100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1}
}

/* Kaarten: rechte kaarten met ronde hoeken, volledige illustratie, duidelijke rand per type */
.cw{container-type:inline-size;width:100%;position:relative}
.card{position:relative;aspect-ratio:5/7;border-radius:6.5cqw;border:2.2cqw solid var(--rc);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14), 0 10px 26px -10px rgba(0,0,0,.65), 0 0 20px -3px var(--rc);
  background:var(--rbg);color:#241C0F;overflow:hidden}
.art{position:absolute;inset:0;background:var(--art);display:grid;place-items:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.chead{position:absolute;top:0;left:0;right:0;padding:3.4cqw 5cqw 8cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw;
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.55) 55%,rgba(255,255,255,0));
  backdrop-filter:blur(5px) saturate(1.1);-webkit-backdrop-filter:blur(5px) saturate(1.1);
  /* blur loopt zacht uit i.p.v. een harde rand */
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
.cname{color:#141414;font:800 6.4cqw/1.12 var(--display);text-shadow:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;max-width:75%}
.cname.xl{font-size:5.6cqw}
.cname.xxl{font-size:4.8cqw}
.hp{color:#141414;font:700 5cqw var(--body);white-space:nowrap;text-shadow:none}
.ptile{width:38cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22);color:#fff;font:800 22cqw/1 var(--display)}
.ptile.cat{background:transparent;font-size:28cqw}
.cfoot{position:absolute;left:0;right:0;bottom:0;padding:9cqw 5cqw 3.6cqw;display:flex;flex-direction:column;gap:1.2cqw;color:#141414;
  background:linear-gradient(0deg,rgba(255,255,255,.86),rgba(255,255,255,.7) 55%,rgba(255,255,255,0));
  backdrop-filter:blur(5px) saturate(1.1);-webkit-backdrop-filter:blur(5px) saturate(1.1);
  -webkit-mask-image:linear-gradient(0deg,#000 70%,transparent);mask-image:linear-gradient(0deg,#000 70%,transparent)}
.cfoot .row1{display:flex;justify-content:space-between;gap:3cqw;font:700 4.8cqw var(--body);white-space:nowrap}
.special{font:700 4.6cqw/1.2 var(--body);color:#141414;border-top:1px solid rgba(0,0,0,.2);padding-top:1.2cqw}
.special small{display:none;font-weight:500;color:rgba(20,20,20,.78)}
/* Beschrijving van de special enkel op grote kaarten (bv. bij het trekken) */
@container (min-width:320px){.special small{display:block;margin-top:1cqw;font-size:4cqw;line-height:1.25}}
.flavor{font:italic 500 4.6cqw/1.22 var(--body);color:rgba(20,20,20,.8);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-common{--rc:#8A98A1;--rbg:linear-gradient(165deg,#fff,#E7ECEF);--art:#DDE4E8}
.r-epic{--rc:#7C4FE0;--rbg:linear-gradient(140deg,#F3EEFF,#D5C7F7 45%,#F3EEFF 60%,#C4B0F2);--art:linear-gradient(135deg,#B9A2F0,#7F5FD0)}
.r-legendary{--rc:#D9A61C;--rbg:linear-gradient(140deg,#FFF6D6,#F1CF6A 45%,#FFF1BE 60%,#E2B83E);--art:linear-gradient(135deg,#F5D97A,#C99A1E)}
.r-legendary .art::after{
  content:"";position:absolute;inset:0;pointer-events:none;background-size:260% 260%;mix-blend-mode:overlay;
  background-image:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.7) 35%,rgba(255,213,120,.55) 45%,transparent 58%,rgba(255,255,255,.45) 74%,transparent 90%);
  animation:holo-sweep 4.2s linear infinite;
}
@keyframes holo-sweep{
  0%{background-position:0% 0%}
  100%{background-position:100% 100%}
}
.r-cat{--rc:#1F8F8A;--rbg:linear-gradient(165deg,#EAFBF9,#C9EEEA);--art:#A9DDD8}
.locked{filter:saturate(.15) brightness(.85)}
.q{font:800 30cqw/1 var(--display);color:rgba(0,0,0,.28)}
.dupe{position:absolute;right:-6px;top:-8px;background:var(--yellow);color:#15181D;border-radius:var(--r-sm);padding:2px 9px;font:700 12px var(--body);z-index:2}

/* Schikkingen die op één scherm passen */
.two-col,.three-col,.stats-wrap{display:grid;gap:22px 36px;align-items:start}
@media (min-width:900px){
  .two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .three-col{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:2px}
  #view .stats-wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  #view .stats-wrap .stat-cards{margin-top:0}
  #view .bars-title{margin-top:0}
}
.bars-title{margin-top:24px}
.index-title{display:flex;align-items:center;gap:8px}
.index-page .info-btn{color:#8a6d12;border-color:#b8962a;background:rgba(201,180,88,.15);width:26px;height:26px;font-size:13px}

/* Statistieken */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:16px}
.stat-card{background:rgba(35,41,50,.88);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.stat-num{font:800 34px var(--display);color:var(--green-soft)}
.stat-label{color:var(--ink-soft);font-size:14.5px;font-weight:600}
.bars{display:grid;gap:10px;margin-top:16px;max-width:560px}
.bar-row{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:12px}
.bar-label{font-size:14.5px;color:var(--ink-soft);font-weight:600}
.bar-track{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);height:22px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));min-width:3px;transition:width .4s ease}
.bar-val{font-weight:700;text-align:right;color:var(--ink-soft)}

/* Vrienden */
.mycode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px;max-width:420px}
.mycode-label{color:var(--ink-soft);font-size:14px;font-weight:600}
.mycode-value{font:800 22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--yellow-soft)}
.friend-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;max-width:460px}
.friend-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}
.friend-av{width:34px;height:34px;border-radius:50%;background-color:var(--bg2);background-size:cover;background-position:center;display:grid;place-items:center;font:700 14px var(--body);color:#fff;flex-shrink:0}
.friend-name{flex:1;font-weight:600}
.friend-open{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.friend-open:hover .friend-name{color:var(--green-soft)}
.friend-more{color:var(--muted);font-size:13.5px;font-weight:600}
.link.danger{color:#F0897E}
.tab-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:#E0584B;color:#fff;font:700 12px/1 var(--body);vertical-align:1px}
.tab-badge[hidden]{display:none}
.accbox.statbox{width:min(620px,94vw);max-height:90vh;overflow-y:auto}
.statbox-head{display:flex;align-items:center;gap:14px}
.statbox-head h2{margin:0}
.statbox-head .friend-av{width:48px;height:48px;font-size:19px}
.statbox .stat-cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.statbox .stat-num{font-size:32px}

/* Traden */
.tselect{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm);padding:13px;min-height:50px;font:16px var(--body)}
.trade-builder{display:grid;gap:24px;margin-top:16px}
@media (min-width:700px){.trade-builder{grid-template-columns:1fr 1fr}}
.trade-builder h4{margin:0 0 12px;font-size:16px}
.dup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.dup-owned{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:8px;margin-left:auto}
.step-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:700 16px var(--body);cursor:pointer;line-height:1}
.step-val{min-width:18px;text-align:center;font-weight:700}
.trade-chip{display:inline-block;padding:4px 10px;border-radius:999px;font:600 13px var(--body);color:#fff;background:var(--rc,var(--grey))}
.trade-list{display:grid;gap:16px;margin-top:14px}
.trade-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;display:grid;gap:8px}
.trade-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trade-side-label{font-weight:700;color:var(--ink-soft);font-size:13.5px;min-width:82px}
.trade-arrow{text-align:center;color:var(--yellow-soft);font-weight:700;margin:2px 0}
.trade-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn.small{width:auto;min-height:auto;padding:10px 18px;font-size:15px}
.pill{background:var(--bg2);border:1px solid var(--line);color:var(--ink-soft);font:700 12.5px var(--body);padding:5px 12px;border-radius:999px}
.pill-turn{background:var(--yellow);color:#15181D;border-color:transparent}
.tmsg:empty{display:none}

/* Battle */
.battle-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.battle-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.battle-top .page-head{margin-bottom:6px}
.diff-btn small,#challengeBattle small{font-weight:700;opacity:.8;margin-left:4px}
.bt-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.bt-head h2{margin:0}
.bt-head .link{padding-left:0}
.bt-layout{display:grid;gap:18px;align-items:start}
@media (min-width:1000px){.bt-layout{grid-template-columns:auto minmax(0,1fr)}.bt-layout .battle-log{max-height:470px}.bt-layout .battle-result{margin-top:0}}
.bt-arena{width:min(600px,100%);grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.bt-side{min-width:0}
.bt-name{font:800 15px var(--body);color:var(--ink-soft)}
.bt-side .fighter-card{max-width:min(190px,calc((100vh - 470px) * .714))}
.energy{display:flex;gap:2px}
.energy .pip{font-size:15px;filter:grayscale(1);opacity:.3}
.energy .pip.on{filter:none;opacity:1}
.bt-side .bench{display:grid;gap:5px;width:100%;max-width:210px}
.bench-card{display:flex;justify-content:space-between;gap:8px;min-width:0;padding:5px 9px;border-radius:10px;border:1px solid var(--line);background:rgba(35,41,50,.9);color:var(--ink);font:600 13px var(--body);text-align:left}
.bench-card span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-card .bench-hp{color:var(--green-soft);white-space:nowrap}
.bench-card.out{opacity:.4}
.bench-card.out .bench-hp{color:#F0897E}
.bench-card:disabled{cursor:default}
.bt-side.choosing .bench-card:not(:disabled){cursor:pointer;border-color:var(--yellow);box-shadow:0 0 0 2px rgba(201,180,88,.35);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(201,180,88,.15)}}
.bt-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:stretch;width:min(600px,100%)}

<body>
<div id="app"><p class="loading">Laden…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---------------------------------------------------------------
// Vul hier de gegevens van je Supabase-project in
// (Project Settings > API). De anon key mag publiek staan.
// ---------------------------------------------------------------
const CONFIG = {
  SUPABASE_URL: 'https://rmgnkwlmgtfamhioncny.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZ25rd2xtZ3RmYW1oaW9uY255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTM3MTMsImV4cCI6MjEwNTYyOTcxM30.rGXsDOX0Bd42qmnXh3VQm2WyQHPymmdSywnFDNOVnUg'
};

// Info uit de link van een wachtwoord-reset-mail. Uitlezen vóór supabase-js
// de URL opkuist; zo weten we zeker dat we het resetformulier moeten tonen.
const URL_HASH = new URLSearchParams(location.hash.slice(1));
const IS_RECOVERY_LINK = URL_HASH.get('type') === 'recovery';
let authLinkError = URL_HASH.get('error_description') || new URLSearchParams(location.search).get('error_description');

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const $ = (sel, el = document) => el.querySelector(sel);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const RARITY_LABEL = { common: 'Common', epic: 'Epic', legendary: 'Legendary', cat: 'Troostkat' };
const PARTICLE_COLORS = {
  common: ['#9aa7b3', '#c8d0d8'],
  epic: ['#8B5CF6', '#C4B0F2', '#F3EEFF'],
  legendary: ['#E8C34C', '#FFF1BE', '#C99A1E'],
  cat: ['#2FA79E', '#8fe0da']
};

const state = { session: null, recovery: IS_RECOVERY_LINK, cards: [], owned: new Map(), play: null, name: '', avatarUrl: null, friendCode: '', wallet: 0, incomingRequests: 0, incomingBattles: 0, welcomeAvailable: false, isAdmin: false, tab: 'today', page: 0,
  levels: new Map(), badges: new Set(), equipped: { frame: null, ring: null, title: null }, v12: false };

// Werkt alle plekken bij die het polycoins-saldo tonen (topbalk + account-tab)
function syncCoinUI() {
  document.querySelectorAll('[data-coin]').forEach(el => { el.textContent = state.wallet; });
}

const todayBrussels = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' });
const tiles = (word, cls) => [...word].map((ch, i) => `<span class="tile t-${cls[i]}">${ch}</span>`).join('');
const plural = n => n === 1 ? 'poging' : 'pogingen';

// ---------- Opstart en routing ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'PASSWORD_RECOVERY') {
      state.session = s; state.recovery = true;
      renderResetPassword();
      return;
    }
    const changed = s?.user?.id !== state.session?.user?.id;
    state.session = s;
    if (changed) route();
  });
  route();
}

// ---------- Snel wisselen tussen accounts op dit toestel ----------
// Sessies van eerder gebruikte accounts worden lokaal bewaard, zodat je zonder
// opnieuw in te loggen kan wisselen (bv. tussen admin en een gewoon testaccount).
const SAVED_KEY = 'ptc-saved-accounts';
function savedAccounts() {
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || {}; } catch (_) { return {}; }
}
function writeSavedAccounts(list) {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch (_) {}
}
async function saveCurrentAccount() {
  const { data: { session } } = await sb.auth.getSession(); // altijd de meest recente tokens
  if (!session) return;
  const list = savedAccounts();
  list[session.user.id] = {
    email: session.user.email, name: state.name || session.user.email,
    access_token: session.access_token, refresh_token: session.refresh_token
  };
  writeSavedAccounts(list);
}
function forgetAccount(userId) {
  const list = savedAccounts();
  delete list[userId];
  writeSavedAccounts(list);
}
async function switchAccount(userId) {
  await saveCurrentAccount();
  const target = savedAccounts()[userId];
  const { error } = await sb.auth.setSession({ access_token: target.access_token, refresh_token: target.refresh_token });
  if (error) {
    forgetAccount(userId);
    throw new Error(`Sessie van ${target.email} is verlopen. Log opnieuw in met dat account.`);
  }
}
async function addAnotherAccount() {
  await saveCurrentAccount();
  // Enkel de lokale sessie wissen (geen signOut), zodat de bewaarde sessie geldig blijft
  try { localStorage.removeItem(sb.auth.storageKey); } catch (_) {}
  location.reload();
}

async function route() {
  if (!state.session) {
    if (state.recovery && !authLinkError) authLinkError = 'De resetlink is ongeldig of verlopen.';
    state.recovery = false;
    renderAuth('login');
    return;
  }
  if (state.recovery) { renderResetPassword(); return; }
  app.innerHTML = '<p class="loading">Laden…</p>';
  try {
    await loadData();
    saveCurrentAccount();
    renderMain();
  } catch (e) {
    app.innerHTML = `<main class="wrap"><p role="alert" class="err">${esc(e.message)}</p><button class="btn" id="out">Uitloggen</button></main>`;
    $('#out').onclick = () => sb.auth.signOut();
  }
}

async function loadData() {
  const uid = state.session.user.id;
  const [cards, mine, prof, wallet, requests, admin, battlesIn, welcome, cosm, levels, badges] = await Promise.all([
    sb.from('cards').select('*').order('id'),
    sb.from('user_cards').select('card_id').eq('user_id', uid),
    sb.from('profiles').select('display_name, avatar_url, friend_code').eq('id', uid).maybeSingle(),
    sb.from('user_wallet').select('polycoins').eq('user_id', uid).maybeSingle(),
    sb.from('friend_requests').select('id', { count: 'exact', head: true }).eq('recipient_id', uid),
    sb.from('admins').select('user_id').eq('user_id', uid).maybeSingle(),
    sb.from('tbattles').select('player_a, player_b, status, moved:state->moved').eq('mode', 'pvp').in('status', ['pending', 'active']).or(`player_a.eq.${uid},player_b.eq.${uid}`),
    sb.from('welcome_packs').select('user_id').eq('user_id', uid).maybeSingle(),
    // Uitbreiding v12 (niet fataal als het script nog niet uitgevoerd is)
    sb.from('profiles').select('equipped_frame, equipped_ring, equipped_title').eq('id', uid).maybeSingle(),
    sb.from('card_levels').select('card_id, level').eq('user_id', uid),
    sb.from('collection_rewards').select('person').eq('user_id', uid)
  ]);
  for (const r of [cards, mine, prof, wallet]) if (r.error) throw new Error(r.error.message);
  // Niet fataal: enkel voor het bolletje op de Vrienden-tab
  state.incomingRequests = requests.error ? 0 : (requests.count || 0);
  // Admin ziet alle kaarten ontgrendeld (enkel weergave; echte bezittingen blijven ongewijzigd)
  state.isAdmin = !admin.error && !!admin.data;
  // Bolletje Battle: uitdagingen aan jou + gevechten tegen vrienden waarin jij aan zet bent
  state.incomingBattles = battlesIn.error ? 0 : (battlesIn.data || []).filter(b =>
    b.status === 'pending' ? b.player_b === uid : !(b.moved || {})[b.player_a === uid ? 'A' : 'B']).length;
  // Welkomstpakket nog niet opgehaald? (zonder schema-v7 bestaat de tabel niet: dan geen knop)
  state.welcomeAvailable = !welcome.error && !welcome.data;
  state.cards = cards.data;
  state.owned = new Map();
  for (const row of mine.data) state.owned.set(row.card_id, (state.owned.get(row.card_id) || 0) + 1);
  state.name = prof.data?.display_name || state.session.user.email.split('@')[0];
  state.avatarUrl = prof.data?.avatar_url || null;
  state.friendCode = prof.data?.friend_code || '';
  state.wallet = wallet.data?.polycoins || 0;
  state.v12 = !levels.error;
  state.levels = new Map((levels.data || []).map(r => [r.card_id, r.level]));
  state.badges = new Set((badges.data || []).map(r => r.person));
  state.equipped = { frame: cosm.data?.equipped_frame || null, ring: cosm.data?.equipped_ring || null, title: cosm.data?.equipped_title || null };
}

function toast(html, ms = 5000) {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = html;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, ms);
}

// Volledige pagina's en het volledige boek belonen (server bepaalt en betaalt; elke beloning maar één keer)
let collectionBusy = false;
async function checkCollection() {
  if (collectionBusy || !state.v12 || !state.session) return;
  collectionBusy = true;
  try {
    const { data, error } = await sb.rpc('claim_collection_rewards');
    if (error || !data?.length) return;
    for (const r of data) {
      state.badges.add(r.person);
      state.wallet += r.reward;
      toast(r.person === '*BOOK*'
        ? `🏆 <strong>Volledig boek!</strong> +${r.reward} 🪙 en de titel <em>Meesterverzamelaar</em> (zet hem aan in de Shop).`
        : `🏅 Pagina <strong>${esc(r.person)}</strong> compleet! +${r.reward} 🪙`, 7000);
    }
    syncCoinUI();
    if (state.tab === 'book') renderView();
  } finally { collectionBusy = false; }
}

// Telt per card_id hoeveel exemplaren een gebruiker bezit, op basis van ruwe user_cards-rijen
function countByCard(rows) {
  const m = new Map();
  for (const r of rows) m.set(r.card_id, (m.get(r.card_id) || 0) + 1);
  return m;
}

// mine: eigen kaart → met level, kaartrand en de knop om op te waarderen
function openZoom(card, { mine = false } = {}) {
  const dlg = $('#zoom');
  let showingBack = false, busy = false, changed = false;
  const front = () => renderCard(card, mine ? mineOpts(card) : {});
  const upHtml = () => {
    if (!mine || !state.v12 || card.rarity === 'cat') return '';
    const lv = myLevel(card.id), extra = Math.max(0, (state.owned.get(card.id) || 0) - 1);
    if (lv >= 3) return `<div class="lvl-up"><p>${stars(3)} Maximaal opgewaardeerd: +20% HP, ATK en DEF in Battle.</p></div>`;
    return extra >= 2
      ? `<div class="lvl-up"><button class="btn small" id="zoomUp" type="button">⬆️ Opwaarderen naar ${stars(lv + 1)} · kost 2 dubbels</button>
         <p>+10% HP, ATK en DEF in Battle per level.</p></div>`
      : `<div class="lvl-up"><p>Nog ${2 - extra} ${2 - extra === 1 ? 'dubbel' : 'dubbels'} nodig om op te waarderen naar ${stars(lv + 1)} (+10% HP, ATK en DEF in Battle).</p></div>`;
  };
  dlg.innerHTML = `<div class="zoombox">
    <button type="button" class="zoom-card" id="zoomCard" aria-label="Kaart omdraaien">
      <div class="zoom-inner" id="zoomInner">${front()}</div>
    </button>
    <p class="zoomhint">Tik op de kaart om ze om te draaien</p>
    <div id="zoomUpBox">${upHtml()}</div>
    <button type="button" class="link" id="zoomClose">Sluiten</button>
  </div>`;
  const bindUp = () => {
    const b = $('#zoomUp');
    if (!b) return;
    b.onclick = async () => {
      if (!confirm(`2 dubbels van "${card.name}" gebruiken om de kaart op te waarderen?`)) return;
      b.disabled = true;
      const { data, error } = await sb.rpc('upgrade_card', { p_card_id: card.id });
      if (error) { alert(error.message); b.disabled = false; return; }
      state.owned.set(card.id, state.owned.get(card.id) - 2);
      state.levels.set(card.id, data.level);
      changed = true;
      showingBack = false;
      $('#zoomInner').innerHTML = front();
      $('#zoomUpBox').innerHTML = upHtml();
      bindUp();
      toast(`⬆️ <strong>${esc(card.name)}</strong> is nu ${stars(data.level)}!`);
    };
  };
  bindUp();
  dlg.onclose = () => { if (changed && ['book', 'today', 'shop'].includes(state.tab)) renderView(); };
  const btn = $('#zoomCard'), inner = $('#zoomInner');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.onclick = async () => {
    if (busy) return;
    busy = true;
    if (!reduce) { btn.classList.add('turning'); await sleep(200); }
    showingBack = !showingBack;
    inner.innerHTML = showingBack ? renderCardBack(card) : front();
    btn.classList.add('turning-back');
    btn.classList.remove('turning');
    if (!reduce) await sleep(200);
    btn.classList.remove('turning-back');
    busy = false;
  };
  $('#zoomClose').onclick = () => dlg.close();
  dlg.showModal();
}

function renderCard(c, { locked = false, count = 1, level = 1, frame = null } = {}) {
  const label = RARITY_LABEL[c.rarity];
  if (locked) {
    return `<div class="cw"><div class="card r-${c.rarity} locked" aria-label="Nog niet verzameld">
      <div class="art"><span class="q">?</span></div>
      <div class="cfoot"><div class="row1"><span>???</span><span>${label}</span></div></div>
    </div></div>`;
  }
  const initial = esc((c.person || '?').trim().charAt(0).toUpperCase());
  const art = c.image_url
    ? `<img src="${esc(c.image_url)}" alt="${esc(c.name)}" loading="lazy">`
    : (c.rarity === 'cat' ? '<span class="ptile cat">🐱</span>' : `<span class="ptile">${initial}</span>`);
  const special = c.special_name
    ? `<div class="special">★ ${esc(c.special_name)}${c.special_power ? ` (${esc(c.special_power)})` : ''}<small>${esc(c.special_desc)}</small></div>`
    : '';
  const flavor = c.flavor_text ? `<div class="flavor">"${esc(c.flavor_text)}"</div>` : '';
  const nameLen = c.name.length;
  const nameCls = nameLen > 22 ? 'cname xxl' : nameLen > 14 ? 'cname xl' : 'cname';
  // Opgewaardeerde kaart: +10% HP/ATK/DEF per level (zelfde berekening als in Battle)
  const lv = c.rarity === 'cat' ? 1 : level;
  const st = v => (lv > 1 && v != null ? Math.round(v * (1 + .1 * (lv - 1))) : v);
  const frameCls = frame ? ' ' + frame.replace('frame_', 'frame-') : '';
  return `<div class="cw${frameCls}">
    ${count > 1 ? `<span class="dupe">×${count}</span>` : ''}
    ${lv > 1 ? `<span class="lvl-badge" title="Level ${lv}">${stars(lv)}</span>` : ''}
    <div class="card r-${c.rarity}">
      <div class="art">${art}</div>
      ${lv >= 3 ? '<span class="glitter" aria-hidden="true"></span>' : ''}
      <div class="chead"><span class="${nameCls}">${esc(c.name)}</span><span class="hp">HP ${esc(st(c.hp))}</span></div>
      <div class="cfoot">
        ${flavor}
        <div class="row1"><span>${label}</span><span>ATK ${esc(st(c.attack))} / DEF ${esc(st(c.defense))}</span></div>
        ${special}
      </div>
    </div></div>`;
}

// ---------- Speelse achtergrond: zwevende tegels die reageren op je muis ----------
function initBackground() {
  const cv = document.createElement('canvas');
  cv.id = 'bgfx'; cv.setAttribute('aria-hidden', 'true');
  document.body.prepend(cv);
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#5DA352', '#C9B458', '#8B93A0', '#7C4FE0', '#2FA79E', '#E0584B'];
  const LETTERS = 'POLYGONCARDSWORDLE';
  let W = 0, H = 0, shapes = [], bits = [];
  const ptr = { x: -999, y: -999, px: 0, py: 0, tx: 0, ty: 0 };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const make = y => ({
    x: rnd(0, W), y: y ?? rnd(0, H), vx: 0, size: rnd(16, 46), z: rnd(.35, 1.2),
    vy: -rnd(8, 22), rot: rnd(0, 6.28), vr: rnd(-.35, .35),
    kind: Math.random() < .62 ? 'tile' : 'poly', sides: 3 + Math.floor(rnd(0, 4)),
    color: pick(COLORS), letter: pick(LETTERS), alpha: rnd(.08, .2)
  });
  const resize = () => {
    const dpr = Math.min(innerWidth < 700 ? 1.5 : 2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const want = W < 700 ? Math.round(Math.min(14, Math.max(8, W * H / 36000))) : Math.round(Math.min(48, Math.max(16, W * H / 30000)));
    while (shapes.length < want) shapes.push(make());
    shapes.length = want;
    if (reduce) draw();
  };
  const shape = (sh, size) => {
    if (sh.kind === 'tile') {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-size / 2, -size / 2, size, size, size * .2); else ctx.rect(-size / 2, -size / 2, size, size);
      ctx.fillStyle = sh.color; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.font = `800 ${size * .58}px 'Bricolage Grotesque', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(sh.letter, 0, size * .04);
    } else {
      ctx.beginPath();
      for (let i = 0; i < sh.sides; i++) {
        const a = i / sh.sides * Math.PI * 2;
        ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * size / 2, Math.sin(a) * size / 2);
      }
      ctx.closePath();
      ctx.lineWidth = 3; ctx.strokeStyle = sh.color; ctx.stroke();
    }
  };
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const sh of shapes) {
      ctx.save();
      ctx.translate(sh.x + ptr.px * 26 * sh.z, sh.y + ptr.py * 26 * sh.z);
      ctx.rotate(sh.rot); ctx.globalAlpha = sh.alpha;
      shape(sh, sh.size * sh.z);
      ctx.restore();
    }
    for (const b of bits) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.globalAlpha = Math.max(0, b.life) * .9;
      shape(b, b.size); ctx.restore();
    }
  }
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ptr.px += (ptr.tx - ptr.px) * .05; ptr.py += (ptr.ty - ptr.py) * .05;
    for (const sh of shapes) {
      // Tegels wijken uit voor de muis
      const dx = sh.x - ptr.x, dy = sh.y - ptr.y, d2 = dx * dx + dy * dy;
      if (d2 < 140 * 140) { const f = (1 - Math.sqrt(d2) / 140) * 220; sh.vx += (dx / (Math.sqrt(d2) || 1)) * f * dt; sh.vr += .6 * dt; }
      sh.vx *= .96; sh.vr = sh.vr * .99 + (sh.vr > 0 ? .002 : -.002);
      sh.x += sh.vx * dt; sh.y += sh.vy * sh.z * dt; sh.rot += sh.vr * dt;
      if (sh.y < -70) Object.assign(sh, make(H + 70));
      if (sh.x < -80) sh.x = W + 70; else if (sh.x > W + 80) sh.x = -70;
    }
    for (const b of bits) { b.vy += 520 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt; b.life -= dt * .7; }
    bits = bits.filter(b => b.life > 0 && b.y < H + 60);
    draw();
    if (document.hidden) { running = false; return; }
    requestAnimationFrame(tick);
  }
  let running = false;
  const start = () => { if (reduce || running) return; running = true; last = performance.now(); requestAnimationFrame(tick); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  addEventListener('resize', resize);
  addEventListener('pointermove', e => {
    ptr.x = e.clientX; ptr.y = e.clientY;
    ptr.tx = e.clientX / W - .5; ptr.ty = e.clientY / H - .5;
  }, { passive: true });
  // Klik of tik op een lege plek: een regen van tegels
  addEventListener('pointerdown', e => {
    if (reduce || e.target.closest('button,a,input,textarea,select,label,dialog,.card,.cw,.book,.menu,.stage,.hub,table,.friend-row,.trade-card,.battle-box,.battle-row,.stat-card,.pick,.mycode')) return;
    for (let i = 0; i < 16 && bits.length < 120; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(160, 420);
      bits.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 220, rot: rnd(0, 6.28), vr: rnd(-8, 8),
        size: rnd(14, 26), kind: Math.random() < .7 ? 'tile' : 'poly', sides: 3 + Math.floor(rnd(0, 4)),
        color: pick(COLORS), letter: pick(LETTERS), life: 1 });
    }
  });
  resize();
  start();
}

function resizeImageToDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Foto kon niet gelezen worden.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ongeldige afbeelding.'));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', .85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- Tab: Today — eigen Wordle, 2 rondes per dag ----------
// Het woord blijft in Supabase: elke gok gaat naar wordle_guess(), die enkel de kleurtjes teruggeeft.
const ROUNDS = { 1: { icon: '☀️', name: 'Ochtend' }, 2: { icon: '🌤️', name: 'Middag' } };
const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', '⏎ZXCVBNM⌫'];
const wordle = { data: null, slot: null, input: '', busy: false, timer: null, loadedAt: 0, hub: null };
let WORDS = null; // geldige gokwoorden (words.txt), één keer geladen

async function loadWords() {
  if (!WORDS) {
    const res = await fetch('words.txt');
    if (!res.ok) throw new Error('Woordenlijst kon niet geladen worden.');
    WORDS = new Set((await res.text()).split('\n').map(w => w.trim().toUpperCase()).filter(Boolean));
  }
  return WORDS;
}

const isDone = s => s.status === 'won' || s.status === 'lost';
const fmtDuration = sec => {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}u ${String(m).padStart(2, '0')}m` : `${m}m ${String(s).padStart(2, '0')}s`;
};
function roundStatus(s) {
  if (!s.open) return `🔒 opent om ${s.opens}`;
  if (s.status === 'won') return `✓ opgelost in ${s.attempts}/${s.max_guesses || 6}`;
  if (s.status === 'lost') return '✗ niet opgelost';
  if (s.rows.length) return `bezig · ${s.rows.length}/${s.max_guesses || 6}`;
  return 'klaar om te spelen';
}
function roundSummary(s) {
  if (s.status === 'won') return `Opgelost in ${s.attempts} ${plural(s.attempts)}! Je pakje is geopend.`;
  if (s.status === 'lost') return `Niet opgelost. Het woord was <strong>${esc(s.answer || '?')}</strong>. Je kreeg een troostkat.`;
  return '';
}

function boardHtml(s) {
  return Array.from({ length: s.max_guesses || 6 }, (_, i) => {
    const row = s.rows[i];
    const letters = row ? row.w : (i === s.rows.length && !isDone(s) ? wordle.input : '');
    return `<div class="wrow" id="wr-${i}">${Array.from({ length: 5 }, (_, j) => {
      const ch = letters[j] || '';
      const cls = row ? ` ${row.r[j]}` : ch ? ' filled' : '';
      return `<div class="wtile${cls}">${esc(ch)}</div>`;
    }).join('')}</div>`;
  }).join('');
}

function keyboardHtml(s) {
  const rank = { g: 3, y: 2, x: 1 }, best = {};
  for (const row of s.rows) [...row.w].forEach((ch, i) => {
    const r = row.r[i];
    if (!best[ch] || rank[r] > rank[best[ch]]) best[ch] = r;
  });
  return KB_ROWS.map(row => `<div class="wkrow">${[...row].map(k => {
    const wide = k === '⏎' || k === '⌫';
    const label = k === '⏎' ? 'Enter' : k;
    return `<button type="button" class="wkey${wide ? ' wide' : ''}${best[k] ? ' ' + best[k] : ''}" data-key="${k}" aria-label="${k === '⌫' ? 'Wissen' : label}">${label}</button>`;
  }).join('')}</div>`).join('');
}

async function renderToday(view) {
  clearInterval(wordle.timer);
  view.innerHTML = `${welcomeBanner()}<section class="col"><p class="hint">Wordle laden…</p></section>`;
  attachWelcome();
  const [{ data, error }] = await Promise.all([sb.rpc('wordle_state'), loadWords().catch(() => null)]);
  if (state.tab !== 'today') return;
  if (error) {
    view.innerHTML = `${welcomeBanner()}<section class="col">${pageHead('Wordle', 'today')}<p class="msg err">De Wordle kon niet geladen worden: ${esc(error.message)}</p></section>`;
    attachWelcome();
    return;
  }
  wordle.data = data;
  wordle.loadedAt = Date.now();
  if (!data.slots.some(s => s.slot === wordle.slot)) wordle.slot = null;
  if (!wordle.slot) {
    const playable = data.slots.find(s => s.open && !isDone(s));
    wordle.slot = playable ? playable.slot : ([...data.slots].reverse().find(s => s.open)?.slot || 1);
  }
  wordle.input = '';
  drawToday(view);
}

function drawToday(view) {
  const slots = wordle.data.slots;
  const s = slots.find(x => x.slot === wordle.slot);
  const card = s.card_id ? state.cards.find(c => c.id === s.card_id) : null;
  view.innerHTML = `${welcomeBanner()}<section class="today-grid">
    <div class="col">
      ${pageHead('Wordle', 'today')}
      <div class="round-tabs" id="roundTabs">${roundTabsHtml()}</div>
      ${s.open ? `
        <div class="wboard" id="wboard" style="--rows:${s.max_guesses || 6}">${boardHtml(s)}</div>
        <p class="msg wmsg${isDone(s) ? ' ok' : ''}" id="wmsg" role="alert">${roundSummary(s)}</p>
        <div class="share-row" id="shareRow">${isDone(s) ? shareBtnHtml() : ''}</div>
        ${isDone(s) ? '' : `<div class="wkeys" id="wkeys">${keyboardHtml(s)}</div>
        <div class="whelp" id="whelp">${helpHtml(s)}</div>`}`
      : `<div class="round-closed">
          <div class="big-lock" aria-hidden="true">🔒</div>
          <p>De ${ROUNDS[s.slot].name.toLowerCase()}-Wordle opent om <strong>${s.opens}</strong> (Belgische tijd).</p>
          <p class="countdown" id="wcount"></p>
        </div>`}
    </div>
    <aside class="hub" id="hub" aria-label="Vandaag">${hubHtml(card)}</aside>
  </section>`;
  attachWelcome();
  bindRoundTabs(view);
  bindShare(s);
  bindHub(card);
  // Eén handler op het hele toetsenbord: blijft werken als de toetsen opnieuw getekend worden
  const keys = $('#wkeys');
  if (keys) keys.onclick = e => { const b = e.target.closest('[data-key]'); if (b) wordleKey(b.dataset.key); };
  bindHelp(s);

  // Aftellen tot een ronde opent; op 0 herladen we de rondes
  clearInterval(wordle.timer);
  const waits = slots.filter(x => !x.open).map(x => wordle.loadedAt + x.seconds_until_open * 1000);
  if (waits.length) {
    const openAt = Math.min(...waits);
    const tick = () => {
      const left = Math.max(0, Math.round((openAt - Date.now()) / 1000));
      const el = $('#wcount');
      if (el) el.textContent = `Nog ${fmtDuration(left)}`;
      if (left === 0) {
        clearInterval(wordle.timer);
        if (state.tab === 'today' && $('#roundTabs')) renderToday(view);
      }
    };
    tick();
    wordle.timer = setInterval(tick, 1000);
  }
}

// ---------- Today-hub: kaart van de ronde, opdrachten, nieuws en klassement ----------
const HUB_TABS = [
  { id: 'card', label: '🎴 Kaart' },
  { id: 'quests', label: '🎯 Opdrachten' },
  { id: 'news', label: '📰 Nieuws' },
  { id: 'board', label: '🏁 Vandaag' },
];
function hubHtml(card) {
  if (!wordle.hub || (wordle.hub === 'card' && !card)) wordle.hub = card ? 'card' : 'quests';
  return `<div class="seg hub-tabs" role="tablist">${HUB_TABS.filter(t => t.id !== 'card' || card).map(t =>
    `<button type="button" role="tab" data-hub="${t.id}" class="${t.id === wordle.hub ? 'on' : ''}" aria-selected="${t.id === wordle.hub}">${t.label}</button>`).join('')}</div>
    <div class="hub-body" id="hubBody" role="tabpanel"></div>`;
}
function bindHub(card) {
  const hub = $('#hub');
  hub.querySelectorAll('[data-hub]').forEach(b => b.onclick = () => {
    wordle.hub = b.dataset.hub;
    hub.querySelectorAll('[data-hub]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    drawHub(card);
  });
  drawHub(card);
}
const v12Missing = '<p class="hint">Deze functie wordt binnenkort geactiveerd.</p>';
async function drawHub(card) {
  const body = $('#hubBody');
  if (!body) return;
  const tab = wordle.hub;
  if (tab === 'card') {
    body.innerHTML = `<div class="stage"><button type="button" class="zoomable" id="hubCard" aria-label="${esc(card.name)} groot bekijken">${renderCard(card, mineOpts(card))}</button>
      <p class="hint" style="margin:0">Je kaart van deze ronde. Tik om ze groot te bekijken.</p></div>`;
    $('#hubCard').onclick = () => openZoom(card, { mine: true });
    return;
  }
  body.innerHTML = '<p class="hint">Laden…</p>';

  if (error) { body.innerHTML = v12Missing; return; }
  if (tab === 'quests') drawQuests(body, data);
  else if (tab === 'news') drawNews(body, data);

function syncQuestDot(quests) {

  if (quests.some(q => !q.claimed && q.progress >= q.target)) b.insertAdjacentHTML('beforeend', '<span class="dot" aria-label="beloning klaar"></span>');
}
function drawQuests(body, quests) {

  body.innerHTML = `<p class="hint">Elke dag 3 nieuwe opdrachten, voor iedereen dezelfde. Haal je beloning op voor middernacht.</p>
    <ul class="quest-list">${quests.map(q => {

        ${q.claimed ? '<span class="pill">✓ Opgehaald</span>'
          : ready ? `<button class="btn small" data-claim="${esc(q.key)}" type="button">Ophalen +${q.reward} 🪙</button>`
          : `<span class="quest-reward">${q.reward} 🪙</span>`}
      </li>`;
    }).join('')}</ul>`;
  body.querySelectorAll('[data-claim]').forEach(b => b.onclick = async () => {

    if (error) { alert(error.message); b.disabled = false; return; }

const timeAgo = iso => {
  const sec = (Date.now() - new Date(iso).getTime()) / 1000;
  if (sec < 60) return 'zonet';
  if (sec < 3600) return `${Math.floor(sec / 60)} min geleden`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} u geleden`;
  const d = Math.floor(sec / 86400);
  return d === 1 ? 'gisteren' : `${d} dagen geleden`;
};
// Toont nooit de naam van een kaart die jij zelf nog niet hebt
function newsLine(a) {
  const me = state.session.user.id;
  const who = `<strong>${a.user_id === me ? 'Jij' : esc(a.display_name)}</strong>`;
  const c = a.data?.card ? cardById(a.data.card) : null;
  const known = c && (state.owned.get(c.id) || state.isAdmin);
  const cardTxt = c ? (known ? `<strong>${esc(c.name)}</strong>` : `een kaart van ${esc(c.person)}`) : 'een kaart';
  switch (a.kind) {
    case 'legendary': return ['🌟', `${who} trok ${c && known ? `de legendary <strong>${esc(c.name)}</strong>` : `een legendary${c ? ` van ${esc(c.person)}` : ''}`}!`];
    case 'battle_win': {
      const opp = a.data?.opponent === me ? 'jou' : esc(a.other_name || 'een vriend');
      return ['⚔️', `${who} won een battle tegen ${opp}${a.data?.forfeit ? ' (opgave)' : ''}.`];
    }
    case 'page_complete': return ['🏅', `${who} vervolledigde de pagina van <strong>${esc(a.data?.person || '?')}</strong>.`];
    case 'book_complete': return ['🏆', `${who} verzamelde het volledige boek!`];
    case 'max_level': return ['⭐', `${who} waardeerde ${cardTxt} op tot ${stars(3)}.`];
    default: return null;

}
function drawNews(body, items) {

function roundTabsHtml() {
  return wordle.data.slots.map(x => `<button type="button" class="round-tab${x.slot === wordle.slot ? ' active' : ''}${isDone(x) ? ' done' : ''}" data-round="${x.slot}">
    <span>${ROUNDS[x.slot].icon} ${ROUNDS[x.slot].name}</span><small>${roundStatus(x)}</small></button>`).join('');
}
function bindRoundTabs(view) {
  view.querySelectorAll('[data-round]').forEach(b => {
    b.onclick = () => {
      if (wordle.busy) return;
      wordle.slot = Number(b.dataset.round); wordle.input = '';
      drawToday(view);
    };

function currentRound() {
  if (state.tab !== 'today' || !wordle.data || !$('#wboard')) return null;
  return wordle.data.slots.find(x => x.slot === wordle.slot) || null;
}

function wordleKey(k) {
  const s = currentRound();
  if (!s || !s.open || isDone(s) || wordle.busy) return;
  if (k === '⌫') { wordle.input = wordle.input.slice(0, -1); return drawInputRow(s); }
  if (k === '⏎') return submitGuess(s);
  if (/^[A-Z]$/.test(k) && wordle.input.length < 5) { wordle.input += k; drawInputRow(s); }
}

function drawInputRow(s) {
  const row = $(`#wr-${s.rows.length}`);
  if (!row) return;
  [...row.children].forEach((t, i) => {
    t.textContent = wordle.input[i] || '';
    t.className = 'wtile' + (wordle.input[i] ? ' filled' : '');
  });
}

async function submitGuess(s) {
  const msg = $('#wmsg'), row = $(`#wr-${s.rows.length}`);
  const fail = text => {
    msg.className = 'msg wmsg err'; msg.textContent = text;
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
  };
  if (wordle.input.length < 5) return fail('Te weinig letters.');
  if (WORDS && !WORDS.has(wordle.input)) return fail('Dat woord staat niet in de woordenlijst.');
  wordle.busy = true;
  msg.className = 'msg wmsg'; msg.textContent = '';
  const { data, error } = await sb.rpc('wordle_guess', { p_slot: s.slot, p_guess: wordle.input });
  if (error) { wordle.busy = false; return fail(error.message); }

  s.rows.push({ w: data.guess, r: data.result });
  wordle.input = '';
  // Tegels één voor één omdraaien en halverwege hun kleur tonen
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  [...row.children].forEach((t, i) => {
    t.textContent = data.guess[i];
    if (reduce) { t.className = `wtile ${data.result[i]}`; return; }
    t.className = 'wtile filled flip';
    t.style.setProperty('--i', i);
    setTimeout(() => { t.className = `wtile flip ${data.result[i]}`; }, i * 220 + 250);
  });
  if (!reduce) await sleep(4 * 220 + 520);
  if ($('#wkeys')) $('#wkeys').innerHTML = keyboardHtml(s);

  if (data.status !== 'playing') {
    Object.assign(s, { status: data.status, attempts: data.attempts, card_id: data.card.id, answer: data.answer });
    state.owned.set(data.card.id, (state.owned.get(data.card.id) || 0) + 1);
    if (data.coinsEarned) { state.wallet += data.coinsEarned; syncCoinUI(); }
    $('#wkeys')?.remove();
    $('#whelp')?.remove();
    msg.className = 'msg wmsg ok'; msg.innerHTML = roundSummary(s);
    $('#roundTabs').innerHTML = roundTabsHtml();
    bindRoundTabs($('#view'));
    $('#shareRow').innerHTML = shareBtnHtml();
    bindShare(s);
    await revealCard(data);
  } else {
    $('#roundTabs').innerHTML = roundTabsHtml();
    bindRoundTabs($('#view'));
  }
  wordle.busy = false;
}

// Fysiek toetsenbord (één keer geregistreerd, enkel actief op Today tijdens een ronde)
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (!currentRound()) return;
  if (e.key === 'Enter') { e.preventDefault(); wordleKey('⏎'); }
  else if (e.key === 'Backspace') { e.preventDefault(); wordleKey('⌫'); }
  else if (/^[a-z]$/i.test(e.key)) wordleKey(e.key.toUpperCase());
});

// Deeltjes rond een net onthulde kaart
function particlesHtml(rarity) {
  const colors = PARTICLE_COLORS[rarity] || PARTICLE_COLORS.common;
  const n = rarity === 'legendary' ? 28 : rarity === 'epic' ? 20 : 12;
  return `<div class="particles">${Array.from({ length: n }, () => {
    const a = Math.random() * 360, d = 70 + Math.random() * 90, delay = Math.random() * .25;
    const c = colors[Math.floor(Math.random() * colors.length)];
    return `<span class="particle" style="--a:${a}deg;--d:${d}px;--pd:${delay}s;--pc:${c}"></span>`;
  }).join('')}</div>`;
}

// Toont een pakje; na een tik scheurt het open, schuiven de kaarten eruit en draaien ze om.
// Gebruikt voor de dagelijkse trekking (1 kaart) en het welkomstpakket (3 kaarten).
async function openPack(stage, cards) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const best = cards.map(c => c.rarity).sort((x, y) => RARITY_ORDER[x] - RARITY_ORDER[y])[0];
  const results = () => `<div class="pack-results${cards.length > 1 ? ' multi' : ''}">${cards.map((c, i) =>
    `<div class="pack-slot" data-slot="${i}"><div class="flipper">${reduce ? renderCard(c) : renderCardBack(c)}</div></div>`).join('')}</div>`;
  if (reduce) { stage.innerHTML = results(); return; }

  stage.innerHTML = `<div class="pack-stage">
    <button class="pack r-${best}" type="button" id="packBtn" aria-label="Pakje openen">
      <div class="pack-card">${renderCardBack(cards[0])}</div>
      <div class="pack-body"><div class="pack-label" aria-hidden="true"><span class="pack-logo">POLYGON</span><span class="pack-sub">TRADING CARDS</span><span class="pack-count">${cards.length === 1 ? '1 kaart' : `${cards.length} kaarten`}</span></div></div>
      <div class="pack-top"></div>
    </button>
    <p class="pack-hint">Tik op het pakje om het open te scheuren</p>
  </div>`;
  const pack = $('#packBtn', stage);
  pack.focus({ preventScroll: true });
  await new Promise(resolve => { pack.onclick = resolve; });
  pack.onclick = null;
  stage.querySelector('.pack-hint').textContent = '';
  pack.classList.add('opening'); await sleep(560);
  pack.classList.add('torn'); await sleep(1000);
  pack.classList.add('done'); await sleep(450);

  stage.innerHTML = results();
  for (const [i, c] of cards.entries()) {
    const slot = stage.querySelector(`[data-slot="${i}"]`), flip = slot.querySelector('.flipper');
    await sleep(i ? 350 : 150);
    flip.classList.add('turning'); await sleep(220);
    flip.innerHTML = renderCard(c);
    slot.insertAdjacentHTML('afterbegin', `<div class="glow ${c.rarity}" style="animation-delay:0s"></div>${particlesHtml(c.rarity)}`);
    flip.classList.add('turning-back'); flip.classList.remove('turning'); await sleep(220);
    flip.classList.remove('turning-back');
    if (c.rarity === 'epic' || c.rarity === 'legendary') {
      slot.classList.add('shake'); setTimeout(() => slot.classList.remove('shake'), 420);
    }
  }
}

function confettiHtml() {
  return `<div class="confetti">${Array.from({ length: 24 }, () => {
    const left = Math.random() * 100, delay = Math.random() * .6;
    const c = ['#E8C34C', '#F0897E', '#8B5CF6', '#4C8A47'][Math.floor(Math.random() * 4)];
